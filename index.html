  <style>
    /* ----------------------------------------- */
    /* 1. PROFESSIONAL CSS STYLING & LAYOUT      */
    /* ----------------------------------------- */
    body { 
      margin: 0; 
      background-color: #0f172a; 
      color: #f8fafc; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }

    h1 { margin-top: 0; font-size: 1.5rem; color: #38bdf8; text-transform: uppercase; letter-spacing: 1px;}

    /* The main video container */
    #webar-player { 
      width: 100%; 
      max-width: 720px; 
      border-radius: 16px; 
      overflow: hidden; 
      box-shadow: 0 20px 40px rgba(0,0,0,0.9); 
      background: #000; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      aspect-ratio: 4/3;
      border: 2px solid #334155;
      position: relative;
    }

    /* Start button styling */
    #start-btn { 
      padding: 16px 32px; 
      font-size: 1.2rem; 
      font-weight: 800; 
      cursor: pointer; 
      background: #10b981; 
      color: #fff; 
      border: none; 
      border-radius: 12px; 
      margin-bottom: 20px;
      transition: all 0.2s ease-in-out;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
    }
    #start-btn:hover { background: #059669; transform: translateY(-2px); }
    #start-btn:disabled { background: #475569; cursor: not-allowed; transform: none; box-shadow: none;}

    /* ----------------------------------------- */
    /* 2. ON-SCREEN TERMINAL LOGGING STYLES      */
    /* ----------------------------------------- */
    #debug-console {
      width: 100%;
      max-width: 720px;
      background: #1e293b;
      border-radius: 8px;
      padding: 15px;
      margin-top: 20px;
      font-family: monospace;
      font-size: 0.9rem;
      height: 200px;
      overflow-y: auto;
      border: 1px solid #475569;
      box-sizing: border-box;
    }
    .log-line { margin: 4px 0; border-bottom: 1px solid #334155; padding-bottom: 4px; }
    .log-info { color: #38bdf8; }
    .log-success { color: #10b981; font-weight: bold; }
    .log-error { color: #ef4444; font-weight: bold; background: rgba(239, 68, 68, 0.1); padding: 4px; }
    .log-warn { color: #f59e0b; }
  </style>
</head>
<body>

  <button id="start-btn">Initialize Camera & AR Engine</button>
  
  <div id="webar-player">
    </div>

  <div id="debug-console">
    <div class="log-line log-info">[System] Debug console initialized. Waiting for user input...</div>
  </div>

  <script type="module">
    /* ----------------------------------------- */
    /* 3. ON-SCREEN LOGGING SYSTEM               */
    /* ----------------------------------------- */
    const debugConsole = document.getElementById('debug-console');
    
    // Custom function to write directly to the screen
    function logToScreen(message, type = 'info') {
      const line = document.createElement('div');
      line.className = `log-line log-${type}`;
      const time = new Date().toLocaleTimeString();
      line.innerText = `[${time}] ${message}`;
      debugConsole.appendChild(line);
      // Auto-scroll to the bottom so you always see the latest log
      debugConsole.scrollTop = debugConsole.scrollHeight; 
      console.log(`[${type.toUpperCase()}] ${message}`);
    }

    // Catch random unseen website errors and force them onto the screen
    window.onerror = function(msg, url, lineNo, columnNo, error) {
      logToScreen(`CRITICAL SCRIPT ERROR: ${msg} (Line: ${lineNo})`, 'error');
      return false;
    };

    /* ----------------------------------------- */
    /* 4. SDK MODULE IMPORTS (STABLE VERSION)    */
    /* ----------------------------------------- */

          const stream = await navigator.mediaDevices.getUserMedia({ video: true });
          logToScreen("Browser granted camera permission successfully!", "success");
          // Stop the test stream so Banuba can take over
          stream.getTracks().forEach(track => track.stop()); 
        } catch (camErr) {
          throw new Error("Camera blocked by browser. Please click the padlock icon in your URL bar and explicitly ALLOW the camera.");
        }

        // STEP 2: BOOT BANUBA AI ENGINE
        logToScreen("Connecting to Banuba Engine with your Client Token...", "info");
        const player = await Player.create({

          locateFile: {
            'BanubaSDK.wasm': 'https://cdn.jsdelivr.net/npm/@banuba/webar@1.18.1/dist/BanubaSDK.wasm',
            'BanubaSDK.simd.wasm': 'https://cdn.jsdelivr.net/npm/@banuba/webar@1.18.1/dist/BanubaSDK.simd.wasm',

          }
        });
        logToScreen("Player created successfully. Token accepted for this domain.", "success");

        // STEP 3: LOAD NEURAL NETWORK FOR FACE TRACKING
        logToScreen("Downloading Heavy Face Tracking Neural Network (this may take a few seconds)...", "warn");
        await player.addModule(new Module('https://cdn.jsdelivr.net/npm/@banuba/webar@1.18.1/dist/modules/face_tracker.zip'));
        logToScreen("Face Tracker module integrated.", "success");

        // STEP 4: BIND WEBCAM TO PLAYER
        logToScreen("Binding webcam feed into the AR Engine...", "info");
        await player.use(new Webcam());
        Dom.render(player, '#webar-player');
        logToScreen("Webcam rendering mounted to screen.", "success");

        // STEP 5: APPLY YOUR LOCAL ZIP FILE
        logToScreen("Fetching local file: './TeethWitening_Toggle.zip'...", "info");
        const effect = new Effect('./TeethWitening_Toggle.zip'); 
        await player.applyEffect(effect);
        logToScreen("Teeth AR Effect successfully applied!", "success");

        // STEP 6: START THE LIVE VIDEO LOOP (This fixes the frozen screen!)
        logToScreen("Unpausing engine and starting live video loop...", "info");
        player.play();

        // SUCCESS STATE
        startBtn.style.display = 'none'; // Hide button on perfect success
        logToScreen("SYSTEM ONLINE. Virtual Try-On is now live.", "success");

      } catch (error) {
        // IF ANYTHING BREAKS, IT CATCHES THE ERROR AND PRINTS IT IN RED HERE
        startBtn.innerText = "Error - Check Logs";
        logToScreen("SYSTEM HALTED DUE TO ERROR:", "error");
        
        // Print the specific reason it failed
        if (error.message) {
          logToScreen(error.message, "error");
        } else {
          logToScreen(JSON.stringify(error), "error");
        }
        
        // Common token mismatch hint
        if(error.message && error.message.includes("token")) {
           logToScreen("HINT: It looks like a Token Domain mismatch. Make sure Vercel's URL matches what you registered on Banuba.", "warn");
        }
      }
    }

    // Attach the function to the button click
    document.getElementById('start-btn').addEventListener('click', startVirtualTryOn);

  </script>
</body>
</html>
