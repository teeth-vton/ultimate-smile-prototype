<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ultimate Smile Design - Tunable AR</title>
  <style>
    body { margin: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; background-color: #111; font-family: sans-serif; overflow: hidden; }
    
    .ar-window { position: relative; width: 640px; height: 480px; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
    video, #threeCanvas { display: none; } 
    #mainCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1); }
    
    /* Splash Screen */
    #uiOverlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; color: white; }
    #startButton { padding: 15px 30px; font-size: 18px; font-weight: bold; background: #fff; color: #000; border: none; border-radius: 30px; cursor: pointer; transition: 0.3s; }
    #startButton:hover { background: #ddd; transform: scale(1.05); }
    
    /* Live Tuning Panel */
    .controls { width: 640px; background: #222; padding: 15px; box-sizing: border-radius: 12px; margin-top: 15px; color: white; border-radius: 12px; display: none; }
    .control-group { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    label { font-size: 14px; width: 120px; }
    input[type=range] { flex-grow: 1; margin: 0 15px; }
    span.val { width: 40px; text-align: right; font-size: 14px; font-weight: bold; color: #4CAF50; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs" type="module"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

  <div class="ar-window">
    <canvas id="mainCanvas" width="640" height="480"></canvas>
    
    <div id="uiOverlay">
      <button id="startButton">Start AR Engine</button>
      <div id="statusText" style="margin-top:15px; display:none;">Loading 3D Asset...</div>
    </div>

    <video id="webcam" autoplay playsinline crossorigin="anonymous"></video>
    <canvas id="threeCanvas" width="640" height="480"></canvas>
  </div>

  <div class="controls" id="controlsPanel">
    <div class="control-group">
      <label>Teeth Size</label>
      <input type="range" id="scaleSlider" min="0.8" max="2.0" step="0.05" value="1.2">
      <span class="val" id="scaleVal">1.2x</span>
    </div>
    <div class="control-group">
      <label>Vertical Offset</label>
      <input type="range" id="ySlider" min="-30" max="30" step="1" value="0">
      <span class="val" id="yVal">0px</span>
    </div>
    <div class="control-group">
      <label>Shade (Whiteness)</label>
      <input type="range" id="shadeSlider" min="150" max="255" step="1" value="255">
      <span class="val" id="shadeVal">BL1</span>
    </div>
  </div>

  <script type="module">
    import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs";

    const video = document.getElementById("webcam");
    const mainCanvas = document.getElementById("mainCanvas");
    const mainCtx = mainCanvas.getContext("2d");
    const threeCanvas = document.getElementById("threeCanvas");
    
    const startButton = document.getElementById("startButton");
    const uiOverlay = document.getElementById("uiOverlay");
    const controlsPanel = document.getElementById("controlsPanel");

    // UI Listeners
    let customScale = 1.2;
    let customYOffset = 0;
    
    document.getElementById('scaleSlider').addEventListener('input', (e) => { customScale = parseFloat(e.target.value); document.getElementById('scaleVal').innerText = customScale + 'x'; });
    document.getElementById('ySlider').addEventListener('input', (e) => { customYOffset = parseInt(e.target.value); document.getElementById('yVal').innerText = customYOffset + 'px'; });

    // --- THREE.JS SETUP ---
    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-320, 320, 240, -240, -2000, 2000);
    camera.position.z = 1000;

    const renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, alpha: true, antialias: true });
    renderer.setSize(640, 480);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
    scene.add(ambientLight);
    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
    directionalLight.position.set(0, 1, 1);
    scene.add(directionalLight);

    let upperGroup = new THREE.Group();
    let lowerGroup = new THREE.Group();
    scene.add(upperGroup);
    scene.add(lowerGroup);

    let modelOriginalWidth = 1;
    let isModelLoaded = false;

    // Hardcoded to brilliant e.max white (no more dark shadows)
    const veneerMaterial = new THREE.MeshStandardMaterial({
      color: 0xffffff, 
      roughness: 0.15, // Glossy like wet enamel
      metalness: 0.1
    });

    // Shade Slider Logic
    document.getElementById('shadeSlider').addEventListener('input', (e) => { 
      const val = parseInt(e.target.value); 
      veneerMaterial.color.setRGB(val/255, val/255, val/255);
      let shadeName = "A3";
      if (val > 240) shadeName = "BL1";
      else if (val > 220) shadeName = "A1";
      else if (val > 190) shadeName = "A2";
      document.getElementById('shadeVal').innerText = shadeName; 
    });

    const loader = new THREE.GLTFLoader();
    loader.load('teeth.glb', function (gltf) {
      const mainModel = gltf.scene;

      const overallBox = new THREE.Box3().setFromObject(mainModel);
      const overallCenter = overallBox.getCenter(new THREE.Vector3());
      const overallSize = overallBox.getSize(new THREE.Vector3());
      modelOriginalWidth = overallSize.x;

      const upperMeshes = [];
      const lowerMeshes = [];

      mainModel.traverse((child) => {
        if (child.isMesh) {
          child.material = veneerMaterial;
          const childBox = new THREE.Box3().setFromObject(child);
          const childCenter = childBox.getCenter(new THREE.Vector3());
          if (childCenter.y > overallCenter.y) upperMeshes.push(child);
          else lowerMeshes.push(child);
        }
      });

      upperMeshes.forEach(mesh => { mesh.position.sub(overallCenter); upperGroup.add(mesh); });
      lowerMeshes.forEach(mesh => { mesh.position.sub(overallCenter); lowerGroup.add(mesh); });

      upperGroup.visible = false;
      lowerGroup.visible = false;
      isModelLoaded = true;
    });

    // --- MEDIAPIPE AI SETUP ---
    let faceLandmarker;
    let lastVideoTime = -1;
    let isARActive = false;

    const INNER_LIP = [78, 191, 80, 81, 82, 13, 312, 311, 310, 415, 308, 324, 318, 402, 317, 14, 87, 178, 88, 95];

    async function initializeAI() {
      const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm");
      faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
        baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task", delegate: "GPU" },
        runningMode: "VIDEO",
        numFaces: 1
      });
    }

    startButton.addEventListener("click", async () => {
      if (!isModelLoaded) {
         document.getElementById("statusText").style.display = "block";
         return;
      }
      uiOverlay.style.display = "none";
      controlsPanel.style.display = "block"; // Show controls once started
      
      const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
      video.srcObject = stream;
      video.addEventListener("loadeddata", () => {
        isARActive = true;
        renderLoop();
      });
    });

    // --- DYNAMIC RENDERING LOOP ---
    function renderLoop() {
      if (video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        const results = faceLandmarker.detectForVideo(video, performance.now());

        mainCtx.drawImage(video, 0, 0, 640, 480);

        if (isARActive && results.faceLandmarks && results.faceLandmarks.length > 0) {
          const landmarks = results.faceLandmarks[0];
          
          const leftCorner = landmarks[78];
          const rightCorner = landmarks[308];
          const topLipInner = landmarks[13];
          const bottomLipInner = landmarks[14];

          const mouthWidthPx = (rightCorner.x - leftCorner.x) * 640;
          const mouthHeightPx = (bottomLipInner.y - topLipInner.y) * 480;

          if (mouthHeightPx > 5) {
            upperGroup.visible = true;
            lowerGroup.visible = true;

            const centerX = ((leftCorner.x + rightCorner.x) / 2) * 640;
            const topY = topLipInner.y * 480;
            const bottomY = bottomLipInner.y * 480;

            // Apply the custom slider scale
            const exactScale = (mouthWidthPx / modelOriginalWidth) * customScale;
            upperGroup.scale.set(exactScale, exactScale, exactScale);
            lowerGroup.scale.set(exactScale, exactScale, exactScale);

            // Apply the custom vertical offset
            upperGroup.position.set(centerX - 320, (240 - topY) + customYOffset, 0);
            lowerGroup.position.set(centerX - 320, (240 - bottomY) + customYOffset, 0);

            const yaw = Math.atan2(rightCorner.z - leftCorner.z, rightCorner.x - leftCorner.x);
            const roll = Math.atan2(rightCorner.y - leftCorner.y, rightCorner.x - leftCorner.x);
            
            upperGroup.rotation.y = yaw;
            upperGroup.rotation.z = -roll;
            lowerGroup.rotation.y = yaw;
            lowerGroup.rotation.z = -roll;

            renderer.render(scene, camera);

            mainCtx.save();
            mainCtx.beginPath();
            INNER_LIP.forEach((idx, i) => {
              const pt = landmarks[idx];
              if (i === 0) mainCtx.moveTo(pt.x * 640, pt.y * 480);
              else mainCtx.lineTo(pt.x * 640, pt.y * 480);
            });
            mainCtx.closePath();
            mainCtx.clip(); 

            mainCtx.drawImage(threeCanvas, 0, 0, 640, 480);
            mainCtx.restore();
          } else {
            upperGroup.visible = false;
            lowerGroup.visible = false;
          }
        }
      }
      window.requestAnimationFrame(renderLoop);
    }

    initializeAI();
  </script>
</body>
</html>
