<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ultimate Smile - 2D Production Engine</title>
  <style>
    body { margin: 0; background: #000; color: #fff; font-family: -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; box-sizing: border-box; }
    .header { text-align: center; margin-bottom: 20px; }
    .ar-workspace { display: flex; gap: 20px; margin-bottom: 20px; }
    .screen-panel { position: relative; width: 480px; height: 360px; border-radius: 12px; overflow: hidden; background: #000; border: 2px solid #444; }
    .view-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1); }
    video { display: none; }
    .debug-console { width: 980px; height: 120px; background: #111; border: 1px solid #333; padding: 10px; overflow-y: scroll; font-family: monospace; font-size: 12px; color: #0f0; margin-bottom: 20px; }
    .controls-panel { width: 980px; background: #222; padding: 20px; border-radius: 12px; }
    .slider-row { display: flex; justify-content: space-between; margin-bottom: 10px; }
    #actionBtn { padding: 15px 40px; font-size: 18px; font-weight: bold; background: #00d2ff; color: #000; border: none; border-radius: 30px; cursor: pointer; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs" type="module"></script>
</head>
<body>

  <div class="header"><h1>ULTIMATE SMILE: 2D FILTER ENGINE</h1></div>
  <button id="actionBtn">INITIALIZE PIXEL ENGINE</button>

  <div class="debug-console" id="logs"></div>

  <div class="ar-workspace">
    <div class="screen-panel"><canvas id="leftCanvas" class="view-canvas" width="480" height="360"></canvas></div>
    <div class="screen-panel"><canvas id="rightCanvas" class="view-canvas" width="480" height="360"></canvas></div>
  </div>

  <div class="controls-panel">
    <div class="slider-row"><label>Filter Whiteness (Opacity)</label><input type="range" id="opacity" min="0.1" max="1.0" step="0.01" value="0.9"><span id="oVal">0.9</span></div>
    <div class="slider-row"><label>Brightness/Glow</label><input type="range" id="glow" min="0" max="100" step="1" value="20"><span id="gVal">20</span></div>
  </div>

  <video id="webcam" autoplay playsinline></video>

  <script type="module">
    import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs";

    const logDiv = document.getElementById("logs");
    function log(m) { logDiv.innerHTML += `<div>> ${m}</div>`; logDiv.scrollTop = logDiv.scrollHeight; }

    const video = document.getElementById("webcam");
    const leftCtx = document.getElementById("leftCanvas").getContext("2d");
    const rightCtx = document.getElementById("rightCanvas").getContext("2d");
    
    let landmarker;
    const opacityRange = document.getElementById("opacity");
    const glowRange = document.getElementById("glow");

    document.getElementById("actionBtn").onclick = async () => {
        log("Loading AI Engine...");
        const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm");
        landmarker = await FaceLandmarker.createFromOptions(vision, { 
            baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task" }, 
            runningMode: "VIDEO" 
        });
        
        const stream = await navigator.mediaDevices.getUserMedia({video: true});
        video.srcObject = stream;
        log("Camera Ready. AI Tracking Active.");
        requestAnimationFrame(loop);
    };

    function loop() {
        const res = landmarker.detectForVideo(video, performance.now());
        leftCtx.drawImage(video, 0, 0, 480, 360);
        rightCtx.drawImage(video, 0, 0, 480, 360);
        
        if(res.faceLandmarks.length > 0) {
            const lm = res.faceLandmarks[0];
            const p = [78, 191, 80, 81, 82, 13, 312, 311, 310, 415, 308, 324, 318, 402, 317, 14, 87, 178, 88, 95];
            
            // Only process if mouth is open
            const mouthOpen = (lm[14].y - lm[13].y) * 480;
            if(mouthOpen > 5) {
                rightCtx.save();
                rightCtx.beginPath();
                p.forEach((idx, i) => i === 0 ? rightCtx.moveTo(lm[idx].x*480, lm[idx].y*360) : rightCtx.lineTo(lm[idx].x*480, lm[idx].y*360));
                rightCtx.closePath();
                rightCtx.clip();
                
                // 2D Dental Filter Injection
                rightCtx.fillStyle = `rgba(255, 255, 255, ${opacityRange.value})`;
                rightCtx.fillRect(0,0,480,360);
                rightCtx.globalCompositeOperation = "soft-light";
                rightCtx.filter = `brightness(${100 + parseInt(glowRange.value)}%)`;
                rightCtx.fillRect(0,0,480,360);
                
                rightCtx.restore();
            }
        }
        requestAnimationFrame(loop);
    }
  </script>
</body>
</html>
