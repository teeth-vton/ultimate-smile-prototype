<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ultimate Smile Design - Surgical Injection</title>
  <style>
    body { margin: 0; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
    .ar-window { position: relative; width: 640px; height: 480px; border-radius: 12px; overflow: hidden; }
    #mainCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1); }
    #uiOverlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; color: #fff; display: flex; justify-content: center; align-items: center; z-index: 20; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs" type="module"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
  <div class="ar-window">
    <canvas id="mainCanvas" width="640" height="480"></canvas>
    <div id="uiOverlay"><button id="startButton">Initialize Surgical AR</button></div>
  </div>

  <script type="module">
    import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs";

    const video = document.createElement("video");
    const mainCanvas = document.getElementById("mainCanvas");
    const mainCtx = mainCanvas.getContext("2d");
    
    // --- THREE.JS SETUP ---
    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-320, 320, 240, -240, 1, 2000);
    camera.position.z = 1000;
    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(640, 480);

    let teethModel;
    const loader = new THREE.GLTFLoader();
    
    // LOAD & CENTER GEOMETRY
    loader.load('teeth.glb', (gltf) => {
        teethModel = gltf.scene;
        
        // 1. CALCULATE TRUE TEETH CENTER (Ignoring gum bloat)
        const box = new THREE.Box3().setFromObject(teethModel);
        const center = new THREE.Vector3();
        box.getCenter(center);
        
        // 2. MOVE MODEL SO TEETH ARE AT 0,0,0
        teethModel.position.sub(center);
        
        // 3. APPLY MATERIAL
        teethModel.traverse(c => { if(c.isMesh) c.material = new THREE.MeshStandardMaterial({color: 0xffffff}); });
        
        scene.add(teethModel);
    });

    // --- AI TRACKING ---
    const landmarker = await FaceLandmarker.createFromOptions(
        await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm"),
        { baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task" }, runningMode: "VIDEO" }
    );

    document.getElementById("startButton").onclick = async () => {
        document.getElementById("uiOverlay").style.display = "none";
        const stream = await navigator.mediaDevices.getUserMedia({video: true});
        video.srcObject = stream;
        video.play();
        requestAnimationFrame(render);
    };

    function render() {
        if(video.readyState === video.HAVE_ENOUGH_DATA) {
            mainCtx.drawImage(video, 0, 0, 640, 480);
            const results = landmarker.detectForVideo(video, performance.now());
            
            if (results.faceLandmarks.length > 0 && teethModel) {
                const lm = results.faceLandmarks[0];
                const lipL = lm[78], lipR = lm[308];
                const mouthWidth = (lipR.x - lipL.x) * 640;
                
                // DYNAMIC SCALING
                const scale = mouthWidth / 150; // 150 is your asset baseline width
                teethModel.scale.set(scale, scale, scale);
                
                // POSITIONING
                const centerX = ((lipL.x + lipR.x)/2) * 640 - 320;
                const centerY = (lm[13].y + lm[14].y)/2 * 480 - 240;
                teethModel.position.set(-centerX, -centerY, 0);
                
                renderer.render(scene, camera);
                mainCtx.drawImage(renderer.domElement, 0, 0);
            }
        }
        requestAnimationFrame(render);
    }
  </script>
</body>
</html>
