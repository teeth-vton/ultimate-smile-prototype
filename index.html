<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart 3D Teeth VTO</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "mindar-face-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-three.prod.js"
      }
    }
  </script>
  <style>
    body { margin: 0; background: #000; }
    #container { width: 100vw; height: 100vh; position: relative; }
    #startBtn { position: absolute; z-index: 10; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 20px 40px; font-size: 20px; cursor: pointer; border-radius: 10px; border: none; background: #00d2ff; }
  </style>
</head>
<body>
  <button id="startBtn">INITIALIZE ENGINE</button>
  <div id="container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { MindARThree } from 'mindar-face-three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const mindarThree = new MindARThree({ container: document.querySelector("#container") });
    const { renderer, scene, camera } = mindarThree;

    // Lights
    const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
    scene.add(light);

    const anchor = mindarThree.addAnchor(10); 
    let teethModel;

    const loader = new GLTFLoader();
    loader.load('./teeth.glb', (gltf) => {
      teethModel = gltf.scene;
      teethModel.scale.set(0.5, 0.5, 0.5); 
      teethModel.position.set(0, -0.6, 0.05); 
      teethModel.visible = false; // Start hidden
      anchor.group.add(teethModel);
    });

    // Start Logic
    document.getElementById("startBtn").onclick = async () => {
      await mindarThree.start();
      document.getElementById("startBtn").style.display = 'none';

      renderer.setAnimationLoop(() => {
        // GET THE MOUTH OPEN STATE
        // MindAR detects facial expressions via the anchor's underlying tracking data
        const face = mindarThree.faceMesh;
        if(teethModel) {
            // Check if mouth is open (Logic based on blendshape estimation)
            // If the model is detected, we check the mouth opening state
            // 0.1 is the threshold: if mouth opening > 10%, show teeth
            const isMouthOpen = face.getBlendshapes ? face.getBlendshapes().jawOpen > 0.1 : true; 
            teethModel.visible = isMouthOpen;
        }
        
        renderer.render(scene, camera);
      });
    };
  </script>
</body>
</html>
