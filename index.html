<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ultimate Smile - Camera Force Sync (Fixed)</title>
  <style>
    body { margin: 0; background: #000; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; box-sizing: border-box; }
    .ar-workspace { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center;}
    .screen-panel { position: relative; width: 480px; height: 360px; border-radius: 12px; overflow: hidden; background: #111; border: 2px solid #444; }
    .view-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1); }
    video { display: none; }
    .debug-console { width: 100%; max-width: 980px; height: 120px; background: #111; border: 1px solid #333; padding: 10px; overflow-y: scroll; font-family: monospace; font-size: 12px; color: #0f0; margin-bottom: 20px; box-sizing: border-box; }
    #actionBtn { padding: 15px 40px; font-size: 18px; font-weight: bold; background: #00d2ff; color: #000; border: none; border-radius: 30px; cursor: pointer; margin-bottom: 20px; transition: 0.3s;}
    #actionBtn:disabled { background: #555; cursor: not-allowed; color: #aaa; }
  </style>
</head>
<body>

  <div class="header"><h1>ULTIMATE SMILE: AR SYNC FIXED</h1></div>
  <button id="actionBtn">INITIALIZE ENGINE</button>
  <div class="debug-console" id="logs"></div>

  <!-- Left Canvas shows Original, Right Canvas shows AR -->
  <div class="ar-workspace">
    <div class="screen-panel"><canvas id="leftCanvas" class="view-canvas" width="480" height="360"></canvas></div>
    <div class="screen-panel"><canvas id="rightCanvas" class="view-canvas" width="480" height="360"></canvas></div>
  </div>

  <video id="webcam" autoplay playsinline></video>

  <script type="module">
    import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs";

    const logDiv = document.getElementById("logs");
    function log(m) { 
        logDiv.innerHTML += `<div>> ${m}</div>`; 
        logDiv.scrollTop = logDiv.scrollHeight; 
        console.log(m); 
    }

    // Catch invisible errors
    window.onerror = function(msg) { log("CRITICAL ERROR: " + msg); };

    const video = document.getElementById("webcam");
    const leftCtx = document.getElementById("leftCanvas").getContext("2d");
    const rightCtx = document.getElementById("rightCanvas").getContext("2d");
    
    let landmarker;
    let lastVideoTime = -1; // THE FIX: This prevents the freeze

    document.getElementById("actionBtn").onclick = async () => {
        const btn = document.getElementById("actionBtn");
        btn.disabled = true;
        btn.innerText = "LOADING AI... PLEASE WAIT";

        try {
            log("1. Requesting Camera Access...");
            const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 }, audio: false });
            video.srcObject = stream;
            
            log("2. Waiting for video feed to sync...");
            await new Promise((resolve) => {
                video.onloadedmetadata = () => {
                    video.play();
                    resolve();
                };
            });
            log("3. Camera Stream Active.");

            log("4. Downloading Google AI Model (This takes 3-5 seconds)...");
            const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm");
            
            landmarker = await FaceLandmarker.createFromOptions(vision, { 
                baseOptions: { 
                    modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task", 
                    delegate: "GPU" // Forces it to use the graphics card
                }, 
                runningMode: "VIDEO",
                numFaces: 1
            });
            log("5. AI Engine Online! Starting AR Loop.");
            
            btn.style.display = "none";
            requestAnimationFrame(loop);

        } catch (e) {
            log("ERROR: " + e.message);
            btn.disabled = false;
            btn.innerText = "RETRY INITIALIZATION";
        }
    };

    function loop() {
        // THE FIX APPLIED: Only run the AI if the video has actually pushed a new frame
        if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
            lastVideoTime = video.currentTime;
            
            // Analyze the face
            const res = landmarker.detectForVideo(video, performance.now());
            
            // Draw the normal video feed onto both screens
            leftCtx.drawImage(video, 0, 0, 480, 360);
            rightCtx.drawImage(video, 0, 0, 480, 360);
            
            // Apply AR to the right screen
            if(res.faceLandmarks && res.faceLandmarks.length > 0) {
                const lm = res.faceLandmarks[0];
                const p = [78, 191, 80, 81, 82, 13, 312, 311, 310, 415, 308, 324, 318, 402, 317, 14, 87, 178, 88, 95];
                
                // Check if the mouth is open
                const mouthOpen = (lm[14].y - lm[13].y) * 480;
                if(mouthOpen > 5) {
                    rightCtx.save();
                    rightCtx.beginPath();
                    p.forEach((idx, i) => {
                        const x = lm[idx].x * 480;
                        const y = lm[idx].y * 360;
                        if (i === 0) rightCtx.moveTo(x, y);
                        else rightCtx.lineTo(x, y);
                    });
                    rightCtx.closePath();
                    
                    // Isolate the area inside the lips
                    rightCtx.clip();
                    
                    // AR Whitening Magic (Overlay makes it realistic instead of solid paint)
                    rightCtx.globalCompositeOperation = "overlay";
                    rightCtx.fillStyle = "rgba(255, 255, 255, 0.6)"; 
                    rightCtx.fillRect(0, 0, 480, 360);
                    
                    rightCtx.restore();
                }
            }
        }
        // Tell the browser to loop this function forever
        requestAnimationFrame(loop);
    }
  </script>
</body>
</html>
