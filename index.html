<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "mindar-face-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-three.prod.js"
      }
    }
  </script>
  <style>
    body { margin: 0; background: #000; }
    #container { width: 100vw; height: 100vh; position: relative; }
    #startBtn { position: absolute; z-index: 10; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 20px 40px; font-size: 20px; cursor: pointer; border-radius: 10px; border: none; background: #00d2ff; }
  </style>
</head>
<body>
  <button id="startBtn">INITIALIZE ENGINE</button>
  <div id="container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { MindARThree } from 'mindar-face-three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const container = document.querySelector("#container");
    const mindarThree = new MindARThree({ container: container });
    const { renderer, scene, camera } = mindarThree;

    // 1. Add Lighting (Fixes the black silhouette)
    const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
    scene.add(light);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1);
    dirLight.position.set(0, 1, 1);
    scene.add(dirLight);

    // 2. Add Anchor (10 is mouth area)
    const anchor = mindarThree.addAnchor(10); 

    // 3. Load Model
    const loader = new GLTFLoader();
    loader.load('./teeth.glb', (gltf) => {
      gltf.scene.scale.set(0.1, 0.1, 0.1); 
      anchor.group.add(gltf.scene);
    });

    // 4. Start Engine
    document.getElementById("startBtn").onclick = async () => {
      await mindarThree.start(); // This triggers the browser camera prompt
      document.getElementById("startBtn").style.display = 'none';
      renderer.setAnimationLoop(() => {
        renderer.render(scene, camera);
      });
    };
  </script>
</body>
</html>
