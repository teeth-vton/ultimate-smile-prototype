<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ultimate Smile Design - True AR</title>
  <style>
    body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #050505; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    
    .ar-window { position: relative; width: 640px; height: 480px; border-radius: 16px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.5); background: #111; }
    video, #threeCanvas { display: none; } 
    #mainCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1); }
    
    #uiOverlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; color: white; text-align: center; backdrop-filter: blur(5px); transition: opacity 0.5s ease; }
    .brand-title { font-size: 24px; font-weight: 800; margin-bottom: 5px; letter-spacing: 1px; }
    .brand-subtitle { font-size: 14px; color: #aaa; margin-bottom: 30px; }
    #startButton { padding: 16px 40px; font-size: 16px; font-weight: bold; background: #ffffff; color: #000; border: none; border-radius: 50px; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(255,255,255,0.2); }
    #startButton:hover { transform: scale(1.05); background: #f0f0f0; }
    #startButton:disabled { opacity: 0.5; cursor: not-allowed; }
    #statusText { font-size: 14px; color: #ddd; margin-top: 15px; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs" type="module"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

  <div class="ar-window">
    <canvas id="mainCanvas" width="640" height="480"></canvas>
    
    <div id="uiOverlay">
      <div class="brand-title">ULTIMATE SMILE</div>
      <div class="brand-subtitle">Hyper-Realistic Virtual Try-On</div>
      <button id="startButton" disabled>Optimizing 3D Asset...</button>
      <div id="statusText">Extracting geometry & textures...</div>
    </div>

    <video id="webcam" autoplay playsinline crossorigin="anonymous"></video>
    <canvas id="threeCanvas" width="640" height="480"></canvas>
  </div>

  <script type="module">
    import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs";

    const video = document.getElementById("webcam");
    const mainCanvas = document.getElementById("mainCanvas");
    const mainCtx = mainCanvas.getContext("2d");
    const threeCanvas = document.getElementById("threeCanvas");
    const uiOverlay = document.getElementById("uiOverlay");
    const startButton = document.getElementById("startButton");
    const statusText = document.getElementById("statusText");

    // --- 1. THREE.JS ENGINE SETUP ---
    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-320, 320, 240, -240, -2000, 2000);
    camera.position.z = 1000;

    const renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, alpha: true, antialias: true });
    renderer.setSize(640, 480);

    // Studio Lighting for glossy reflections
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
    scene.add(ambientLight);
    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
    directionalLight.position.set(0, 100, 300);
    scene.add(directionalLight);

    // Dynamic Tracking Groups
    let upperGroup = new THREE.Group();
    let lowerGroup = new THREE.Group();
    let masterContainer = new THREE.Group();
    masterContainer.add(upperGroup);
    masterContainer.add(lowerGroup);
    scene.add(masterContainer);

    let isModelReady = false;
    const loader = new THREE.GLTFLoader();
    const cleanUrl = 'teeth.glb?nocache=' + Date.now();

    loader.load(cleanUrl, function (gltf) {
      const rawModel = gltf.scene;

      // Calculate absolute center and size for Auto-Normalizer
      const overallBox = new THREE.Box3().setFromObject(rawModel);
      const overallCenter = new THREE.Vector3();
      overallBox.getCenter(overallCenter);
      const overallSize = new THREE.Vector3();
      overallBox.getSize(overallSize);

      // Normalize scale so the master container is exactly 1.0 units wide
      const normalizeScale = 1 / overallSize.x;
      masterContainer.scale.set(normalizeScale, normalizeScale, normalizeScale);

      // Auto-Splitter & Material Upgrader
      rawModel.traverse((child) => {
        if (child.isMesh) {
          // Keep original artist colors/textures but upgrade to glossy physical material
          const origColor = child.material.color || new THREE.Color(0xffffff);
          const origMap = child.material.map || null;

          child.material = new THREE.MeshPhysicalMaterial({
            color: origColor,
            map: origMap,
            roughness: 0.15, // Glossy saliva look
            metalness: 0.0,
            clearcoat: 1.0,
            clearcoatRoughness: 0.05
          });

          const childBox = new THREE.Box3().setFromObject(child);
          const childCenter = new THREE.Vector3();
          childBox.getCenter(childCenter);

          // Center the piece globally so tracking aligns perfectly
          child.position.sub(overallCenter);

          // Split logic: Above center goes to top jaw, below goes to bottom jaw
          if (childCenter.y > overallCenter.y) {
            upperGroup.add(child);
          } else {
            lowerGroup.add(child);
          }
        }
      });

      upperGroup.visible = false;
      lowerGroup.visible = false;
      
      isModelReady = true;
      startButton.disabled = false;
      startButton.innerText = "Start Virtual Try-On";
      statusText.innerText = "Asset processed successfully.";
    });

    // --- 2. MEDIAPIPE AI TRACKING CORE ---
    let faceLandmarker;
    let lastVideoTime = -1;
    let isARActive = false;

    // The inner lip coordinates to punch a hole for the teeth to show through
    const INNER_LIP_CONTOUR = [78, 191, 80, 81, 82, 13, 312, 311, 310, 415, 308, 324, 318, 402, 317, 14, 87, 178, 88, 95];

    // Anti-Jitter Smoothing Math
    let smoothWidth = 0, smoothCenterX = 0;
    let smoothTopY = 0, smoothBottomY = 0;
    let smoothYaw = 0, smoothRoll = 0, smoothLateralShift = 0;
    const EMA_ALPHA = 0.4; 

    async function initializeAI() {
      const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm");
      faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
        baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task", delegate: "GPU" },
        runningMode: "VIDEO",
        numFaces: 1
      });
    }

    startButton.addEventListener("click", async () => {
      if (!isModelReady) return;
      startButton.style.display = "none";
      statusText.innerText = "Connecting camera...";
      
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, facingMode: "user" } });
        video.srcObject = stream;
        video.addEventListener("loadeddata", () => {
          uiOverlay.style.opacity = "0";
          setTimeout(() => uiOverlay.style.display = "none", 500);
          isARActive = true;
          renderLoop();
        });
      } catch (err) {
        statusText.innerText = "Camera access denied. Please allow permissions.";
      }
    });

    // --- 3. PHYSICS & RENDERING LOOP ---
    function renderLoop() {
      if (video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        const results = faceLandmarker.detectForVideo(video, performance.now());

        mainCtx.drawImage(video, 0, 0, 640, 480);

        if (isARActive && results.faceLandmarks && results.faceLandmarks.length > 0) {
          const lm = results.faceLandmarks[0];
          
          const leftCorner = lm[78];
          const rightCorner = lm[308];
          const topLip = lm[13];
          const bottomLip = lm[14];
          const noseTip = lm[4];
          const chinTip = lm[152];

          // Raw Frame Data
          const rawMouthWidth = (rightCorner.x - leftCorner.x) * 640;
          const rawMouthHeight = (bottomLip.y - topLip.y) * 480;
          const rawCenterX = ((leftCorner.x + rightCorner.x) / 2) * 640;
          const rawTopY = topLip.y * 480;
          const rawBottomY = bottomLip.y * 480;
          
          const rawYaw = Math.atan2(rightCorner.z - leftCorner.z, rightCorner.x - leftCorner.x);
          const rawRoll = Math.atan2(rightCorner.y - leftCorner.y, rightCorner.x - leftCorner.x);
          const rawLateralShift = (chinTip.x - noseTip.x) * 640; 

          // Apply Anti-Jitter Filters
          smoothWidth = (rawMouthWidth * EMA_ALPHA) + (smoothWidth * (1 - EMA_ALPHA));
          smoothCenterX = (rawCenterX * EMA_ALPHA) + (smoothCenterX * (1 - EMA_ALPHA));
          smoothTopY = (rawTopY * EMA_ALPHA) + (smoothTopY * (1 - EMA_ALPHA));
          smoothBottomY = (rawBottomY * EMA_ALPHA) + (smoothBottomY * (1 - EMA_ALPHA));
          smoothYaw = (rawYaw * EMA_ALPHA) + (smoothYaw * (1 - EMA_ALPHA));
          smoothRoll = (rawRoll * EMA_ALPHA) + (smoothRoll * (1 - EMA_ALPHA));
          smoothLateralShift = (rawLateralShift * EMA_ALPHA) + (smoothLateralShift * (1 - EMA_ALPHA));

          // Only render if mouth is open
          if (rawMouthHeight > 8) {
            upperGroup.visible = true;
            lowerGroup.visible = true;

            // Sizing calculation based on mouth width
            const exactScale = smoothWidth * 1.10; // 10% padding to tuck into corners
            masterContainer.scale.set(exactScale, exactScale, exactScale);

            // Positioning conversions for Three.js
            const threeX = smoothCenterX - 320;
            const threeUpperY = 240 - smoothTopY;
            const threeLowerY = 240 - smoothBottomY;

            // Split Jaw Syncing (The Lenskart Engine)
            upperGroup.position.set(threeX, threeUpperY, 0);
            lowerGroup.position.set(threeX + smoothLateralShift, threeLowerY, 0);

            // Global Head Rotation
            upperGroup.rotation.set(0, smoothYaw, -smoothRoll);
            
            // TMJ Jaw dropping physics for the bottom teeth
            const mouthOpenness = smoothBottomY - smoothTopY;
            const jawTiltX = Math.max(0, mouthOpenness * 0.015);
            lowerGroup.rotation.set(-jawTiltX, smoothYaw, -smoothRoll);

            renderer.render(scene, camera);

            // Stencil Clipping Mask (Keeps teeth strictly behind the lips)
            mainCtx.save();
            mainCtx.beginPath();
            INNER_LIP_CONTOUR.forEach((idx, i) => {
              const pt = lm[idx];
              if (i === 0) mainCtx.moveTo(pt.x * 640, pt.y * 480);
              else mainCtx.lineTo(pt.x * 640, pt.y * 480);
            });
            mainCtx.closePath();
            mainCtx.clip(); 

            mainCtx.drawImage(threeCanvas, 0, 0, 640, 480);
            mainCtx.restore();
          } else {
            upperGroup.visible = false;
            lowerGroup.visible = false;
          }
        }
      }
      window.requestAnimationFrame(renderLoop);
    }

    initializeAI();
  </script>
</body>
</html>
