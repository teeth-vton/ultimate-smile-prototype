<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ultimate Smile - Live Sync AR</title>
  <style>
    body { margin: 0; background: #0a0a0a; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; color: white;}
    
    .header { text-align: center; margin-bottom: 20px; }
    #startButton { padding: 12px 30px; font-size: 14px; font-weight: bold; background: #fff; color: #000; border: none; border-radius: 30px; cursor: pointer; transition: 0.2s;}
    #startButton:hover { transform: scale(1.05); }
    #startButton:disabled { background: #333; color: #666; cursor: not-allowed; }

    .dashboard { display: flex; gap: 20px; margin-bottom: 20px; }
    
    .screen-container { position: relative; width: 480px; height: 360px; border-radius: 12px; overflow: hidden; border: 2px solid #333; background: #000;}
    .screen-label { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.8); padding: 5px 10px; border-radius: 5px; font-size: 11px; font-weight: bold; z-index: 10;}
    
    /* Mirrors the feeds so it feels natural */
    .mirrored-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1); }
    #threeCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1); display: none; }
    video { display: none; }

    /* Model Rescue Sliders */
    .controls { width: 980px; background: #1a1a1a; padding: 15px; box-sizing: border-box; border-radius: 12px; display: none; }
    .control-group { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    label { font-size: 12px; width: 180px; color: #aaa; font-weight: bold; }
    input[type=range] { flex-grow: 1; margin: 0 15px; }
    span.val { width: 50px; text-align: right; font-size: 12px; font-weight: bold; color: #fff;}
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs" type="module"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

  <div class="header">
    <h2 style="margin:0 0 10px 0; letter-spacing: 1px;">LIVE AR SYNC</h2>
    <button id="startButton" disabled>Loading 3D Model...</button>
  </div>

  <div class="dashboard">
    <div class="screen-container">
      <div class="screen-label" style="color: #ff4444;">LEFT: AI TRACKING DATA</div>
      <canvas id="leftCanvas" class="mirrored-canvas" width="480" height="360"></canvas>
    </div>

    <div class="screen-container" style="border-color: #00d2ff;">
      <div class="screen-label" style="color: #00d2ff;">RIGHT: LIVE AR TRY-ON</div>
      <canvas id="rightCanvas" class="mirrored-canvas" width="480" height="360"></canvas>
      <canvas id="threeCanvas" width="480" height="360"></canvas>
    </div>
  </div>

  <div class="controls" id="controlsPanel">
    <div style="font-size: 11px; text-transform: uppercase; color: #00d2ff; margin-bottom: 10px;">Model Calibration (Fix Floating/Size Issues)</div>
    <div class="control-group">
      <label>Scale (Size)</label>
      <input type="range" id="scaleSlider" min="0.01" max="3.0" step="0.01" value="0.5">
      <span class="val" id="scaleVal">0.5x</span>
    </div>
    <div class="control-group">
      <label>Y-Offset (Fix Floating)</label>
      <input type="range" id="ySlider" min="-200" max="200" step="1" value="-30">
      <span class="val" id="yVal">-30px</span>
    </div>
  </div>

  <video id="webcam" autoplay playsinline crossorigin="anonymous"></video>

  <script type="module">
    import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs";

    const video = document.getElementById("webcam");
    const leftCtx = document.getElementById("leftCanvas").getContext("2d");
    const rightCtx = document.getElementById("rightCanvas").getContext("2d");
    const threeCanvas = document.getElementById("threeCanvas");
    const startButton = document.getElementById("startButton");
    const controlsPanel = document.getElementById("controlsPanel");

    // Slider State
    let customScale = 0.5;
    let customY = -30;

    document.getElementById('scaleSlider').addEventListener('input', (e) => { customScale = parseFloat(e.target.value); document.getElementById('scaleVal').innerText = customScale.toFixed(2) + 'x'; });
    document.getElementById('ySlider').addEventListener('input', (e) => { customY = parseInt(e.target.value); document.getElementById('yVal').innerText = customY + 'px'; });

    // --- THREE.JS ---
    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-240, 240, 180, -180, -2000, 2000);
    camera.position.z = 1000;
    
    // Alpha must be true so the background is transparent over your face
    const renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, alpha: true, antialias: true });
    renderer.setSize(480, 360);

    const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
    dirLight.position.set(0, 100, 300);
    scene.add(dirLight);

    let upperGroup = new THREE.Group();
    let lowerGroup = new THREE.Group();
    scene.add(upperGroup);
    scene.add(lowerGroup);

    let isModelReady = false;
    let modelOriginalWidth = 1;

    const loader = new THREE.GLTFLoader();
    loader.load('teeth.glb?nocache=' + Date.now(), function (gltf) {
      const rawModel = gltf.scene;

      const overallBox = new THREE.Box3().setFromObject(rawModel);
      const overallCenter = new THREE.Vector3();
      overallBox.getCenter(overallCenter);
      const overallSize = new THREE.Vector3();
      overallBox.getSize(overallSize);
      modelOriginalWidth = overallSize.x;

      rawModel.traverse((child) => {
        if (child.isMesh) {
          // Force pure white material and disable broken vertex colors
          child.material = new THREE.MeshPhysicalMaterial({
            color: 0xffffff,
            roughness: 0.1,
            metalness: 0.0,
            clearcoat: 1.0
          });
          child.material.vertexColors = false; 

          const childBox = new THREE.Box3().setFromObject(child);
          const childCenter = new THREE.Vector3();
          childBox.getCenter(childCenter);
          child.position.sub(overallCenter);

          if (childCenter.y > overallCenter.y) upperGroup.add(child);
          else lowerGroup.add(child);
        }
      });

      upperGroup.visible = false;
      lowerGroup.visible = false;
      
      isModelReady = true;
      startButton.disabled = false;
      startButton.innerText = "Start Live AR Sync";
    });

    // --- MEDIAPIPE AI ---
    let faceLandmarker;
    let lastVideoTime = -1;
    let isARActive = false;

    // The Stencil hole shape
    const INNER_LIP_CONTOUR = [78, 191, 80, 81, 82, 13, 312, 311, 310, 415, 308, 324, 318, 402, 317, 14, 87, 178, 88, 95];

    async function initializeAI() {
      const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm");
      faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
        baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task", delegate: "GPU" },
        runningMode: "VIDEO",
        numFaces: 1
      });
    }

    startButton.addEventListener("click", async () => {
      if (!isModelReady) return;
      startButton.style.display = "none";
      controlsPanel.style.display = "block";
      
      const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 480, height: 360 } });
      video.srcObject = stream;
      video.addEventListener("loadeddata", () => {
        isARActive = true;
        renderLoop();
      });
    });

    function renderLoop() {
      if (video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        const results = faceLandmarker.detectForVideo(video, performance.now());

        // Draw webcam to BOTH screens
        leftCtx.drawImage(video, 0, 0, 480, 360);
        rightCtx.drawImage(video, 0, 0, 480, 360);

        if (isARActive && results.faceLandmarks && results.faceLandmarks.length > 0) {
          const lm = results.faceLandmarks[0];
          
          const leftCorner = lm[78];
          const rightCorner = lm[308];
          const topLip = lm[13];
          const bottomLip = lm[14];
          const chinTip = lm[152];

          // 1. LEFT SCREEN (AI DOTS)
          leftCtx.fillStyle = "#ff4444";
          INNER_LIP_CONTOUR.forEach(idx => {
            leftCtx.beginPath();
            leftCtx.arc(lm[idx].x * 480, lm[idx].y * 360, 2, 0, 2*Math.PI);
            leftCtx.fill();
          });
          leftCtx.fillStyle = "#00ff00";
          leftCtx.beginPath(); leftCtx.arc(chinTip.x * 480, chinTip.y * 360, 4, 0, 2*Math.PI); leftCtx.fill();


          // 2. RIGHT SCREEN (AR TRY-ON)
          const mouthWidth = (rightCorner.x - leftCorner.x) * 480;
          const mouthHeight = (bottomLip.y - topLip.y) * 360;
          const centerX = ((leftCorner.x + rightCorner.x) / 2) * 480;
          const topY = topLip.y * 360;
          const bottomY = bottomLip.y * 360;

          if (mouthHeight > 4) {
            upperGroup.visible = true;
            lowerGroup.visible = true;

            // Apply Size Slider
            const exactScale = (mouthWidth / modelOriginalWidth) * customScale;
            upperGroup.scale.set(exactScale, exactScale, exactScale);
            lowerGroup.scale.set(exactScale, exactScale, exactScale);

            // Apply Y-Offset Slider to fix floating
            upperGroup.position.set(centerX - 240, (180 - topY) + customY, 0);
            lowerGroup.position.set(centerX - 240, (180 - bottomY) + customY, 0);

            const yaw = Math.atan2(rightCorner.z - leftCorner.z, rightCorner.x - leftCorner.x);
            const roll = Math.atan2(rightCorner.y - leftCorner.y, rightCorner.x - leftCorner.x);
            upperGroup.rotation.set(0, yaw, -roll);
            lowerGroup.rotation.set(0, yaw, -roll);

            renderer.render(scene, camera);

            // Stencil Hole Punch
            rightCtx.save();
            rightCtx.beginPath();
            INNER_LIP_CONTOUR.forEach((idx, i) => {
              const pt = lm[idx];
              if (i === 0) rightCtx.moveTo(pt.x * 480, pt.y * 360);
              else rightCtx.lineTo(pt.x * 480, pt.y * 360);
            });
            rightCtx.closePath();
            rightCtx.clip(); 

            // Paste AR Teeth into the hole on the Right Canvas
            rightCtx.drawImage(threeCanvas, 0, 0, 480, 360);
            rightCtx.restore();
          } else {
            upperGroup.visible = false;
            lowerGroup.visible = false;
          }
        }
      }
      window.requestAnimationFrame(renderLoop);
    }

    initializeAI();
  </script>
</body>
</html>
