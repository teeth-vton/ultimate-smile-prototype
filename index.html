<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ultimate Smile Design - True Color Match AR</title>
  <style>
    body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #000; font-family: sans-serif; overflow: hidden; }
    .container { position: relative; width: 640px; height: 480px; }
    
    video, #threeCanvas { display: none; } 
    #mainCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    
    #uiOverlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; flex-direction: column; justify-content: center; align-items: center; border-radius: 12px; z-index: 10; color: white; text-align: center; padding: 20px;}
    #startButton { padding: 15px 30px; font-size: 18px; font-weight: bold; background: #fff; color: #000; border: none; border-radius: 30px; cursor: pointer; transition: 0.3s; margin-bottom: 10px;}
    #startButton:hover { background: #ddd; transform: scale(1.05); }
    #statusText { font-size: 16px; display: none; }
    .hint { font-size: 14px; color: #aaa; margin-top: 10px; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs" type="module"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

  <div class="container">
    <canvas id="mainCanvas" width="640" height="480"></canvas>
    
    <div id="uiOverlay">
      <button id="startButton">Start Auto-Match AR</button>
      <div id="statusText">Analyzing 3D geometry...</div>
      <div class="hint">Tip: Smile wide at the camera for the best color match.</div>
    </div>

    <video id="webcam" autoplay playsinline crossorigin="anonymous"></video>
    <canvas id="threeCanvas" width="640" height="480"></canvas>
  </div>

  <script type="module">
    import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs";

    const video = document.getElementById("webcam");
    const mainCanvas = document.getElementById("mainCanvas");
    const mainCtx = mainCanvas.getContext("2d", { willReadFrequently: true }); // Optimized for pixel reading
    const threeCanvas = document.getElementById("threeCanvas");
    
    const startButton = document.getElementById("startButton");
    const statusText = document.getElementById("statusText");
    const uiOverlay = document.getElementById("uiOverlay");

    // --- 1. THREE.JS SETUP ---
    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-320, 320, 240, -240, -2000, 2000);
    camera.position.z = 1000;

    const renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, alpha: true, antialias: true });
    renderer.setSize(640, 480);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
    scene.add(ambientLight);
    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.4);
    directionalLight.position.set(0, 1, 1);
    scene.add(directionalLight);

    let upperGroup = new THREE.Group();
    let lowerGroup = new THREE.Group();
    scene.add(upperGroup);
    scene.add(lowerGroup);

    let modelOriginalWidth = 1;
    let isModelLoaded = false;

    // Start with a base white, but we will dynamically shift this
    const veneerMaterial = new THREE.MeshStandardMaterial({
      color: 0xffffff, 
      roughness: 0.3,
      metalness: 0.05
    });

    const loader = new THREE.GLTFLoader();
    loader.load('teeth.glb', function (gltf) {
      const mainModel = gltf.scene;

      const overallBox = new THREE.Box3().setFromObject(mainModel);
      const overallCenter = overallBox.getCenter(new THREE.Vector3());
      const overallSize = overallBox.getSize(new THREE.Vector3());
      modelOriginalWidth = overallSize.x;

      const upperMeshes = [];
      const lowerMeshes = [];

      mainModel.traverse((child) => {
        if (child.isMesh) {
          child.material = veneerMaterial;
          const childBox = new THREE.Box3().setFromObject(child);
          const childCenter = childBox.getCenter(new THREE.Vector3());
          if (childCenter.y > overallCenter.y) upperMeshes.push(child);
          else lowerMeshes.push(child);
        }
      });

      upperMeshes.forEach(mesh => {
        mesh.position.sub(overallCenter);
        upperGroup.add(mesh);
      });

      lowerMeshes.forEach(mesh => {
        mesh.position.sub(overallCenter);
        lowerGroup.add(mesh);
      });

      upperGroup.visible = false;
      lowerGroup.visible = false;
      isModelLoaded = true;
      document.getElementById("statusText").innerText = "Ready. Click Start & Smile!";
    });

    // --- 2. MEDIAPIPE AI SETUP ---
    let faceLandmarker;
    let lastVideoTime = -1;
    let isARActive = false;

    const INNER_LIP = [78, 191, 80, 81, 82, 13, 312, 311, 310, 415, 308, 324, 318, 402, 317, 14, 87, 178, 88, 95];

    async function initializeAI() {
      const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm");
      faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
        baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task", delegate: "GPU" },
        runningMode: "VIDEO",
        numFaces: 1
      });
    }

    startButton.addEventListener("click", async () => {
      if (!isModelLoaded) return;
      uiOverlay.style.display = "none";
      
      const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
      video.srcObject = stream;
      video.addEventListener("loadeddata", () => {
        isARActive = true;
        renderLoop();
      });
    });

    // --- COLOR SAMPLING FUNCTION ---
    function getAverageWebcamColor(context, x, y, width, height) {
      // Ensure we don't sample outside the canvas edges
      if (x < 0 || y < 0 || x + width > 640 || y + height > 480) return null;
      
      const imageData = context.getImageData(x, y, width, height);
      const data = imageData.data;
      let r = 0, g = 0, b = 0;
      
      for (let i = 0; i < data.length; i += 4) {
        r += data[i];
        g += data[i+1];
        b += data[i+2];
      }
      
      const count = data.length / 4;
      return new THREE.Color(`rgb(${Math.floor(r/count)}, ${Math.floor(g/count)}, ${Math.floor(b/count)})`);
    }

    // --- 3. DYNAMIC RENDERING LOOP ---
    function renderLoop() {
      if (video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        const results = faceLandmarker.detectForVideo(video, performance.now());

        // Draw webcam feed
        mainCtx.drawImage(video, 0, 0, 640, 480);

        if (isARActive && results.faceLandmarks && results.faceLandmarks.length > 0) {
          const landmarks = results.faceLandmarks[0];
          
          const leftCorner = landmarks[78];
          const rightCorner = landmarks[308];
          const topLipInner = landmarks[13];
          const bottomLipInner = landmarks[14];

          const mouthWidthPx = (rightCorner.x - leftCorner.x) * 640;
          const mouthHeightPx = (bottomLipInner.y - topLipInner.y) * 480;

          if (mouthHeightPx > 5) {
            upperGroup.visible = true;
            lowerGroup.visible = true;

            const centerX = ((leftCorner.x + rightCorner.x) / 2) * 640;
            const centerY = ((topLipInner.y + bottomLipInner.y) / 2) * 480;
            const topY = topLipInner.y * 480;
            const bottomY = bottomLipInner.y * 480;

            // --- FEATURE 1: DYNAMIC COLOR MATCHING ---
            // If the user smiles wide enough, sample the pixels right in the middle of their mouth
            if (mouthHeightPx > 15) {
              // Sample a small 10x10 pixel box from the webcam feed
              const sampledColor = getAverageWebcamColor(mainCtx, centerX - 5, centerY - 5, 10, 10);
              if (sampledColor) {
                // Smoothly transition the 3D material color to match the room lighting and natural teeth
                // '0.05' ensures it shifts gradually and doesn't flicker wildly
                veneerMaterial.color.lerp(sampledColor, 0.05);
              }
            }

            // --- FEATURE 2: EXACT SIZE FIX ---
            // Removed the artificial 1.05 multiplier. It now scales exactly 1:1 with your lip corners.
            const exactScale = mouthWidthPx / modelOriginalWidth;
            upperGroup.scale.set(exactScale, exactScale, exactScale);
            lowerGroup.scale.set(exactScale, exactScale, exactScale);

            // Anchor strictly to the upper and lower lip inner lines
            upperGroup.position.set(centerX - 320, 240 - topY, 0);
            lowerGroup.position.set(centerX - 320, 240 - bottomY, 0);

            const yaw = Math.atan2(rightCorner.z - leftCorner.z, rightCorner.x - leftCorner.x);
            const roll = Math.atan2(rightCorner.y - leftCorner.y, rightCorner.x - leftCorner.x);
            
            upperGroup.rotation.y = yaw;
            upperGroup.rotation.z = -roll;
            lowerGroup.rotation.y = yaw;
            lowerGroup.rotation.z = -roll;

            renderer.render(scene, camera);

            // Stencil mask clipping
            mainCtx.save();
            mainCtx.beginPath();
            INNER_LIP.forEach((idx, i) => {
              const pt = landmarks[idx];
              if (i === 0) mainCtx.moveTo(pt.x * 640, pt.y * 480);
              else mainCtx.lineTo(pt.x * 640, pt.y * 480);
            });
            mainCtx.closePath();
            mainCtx.clip(); 

            mainCtx.drawImage(threeCanvas, 0, 0, 640, 480);
            mainCtx.restore();
          } else {
            upperGroup.visible = false;
            lowerGroup.visible = false;
          }
        }
      }
      window.requestAnimationFrame(renderLoop);
    }

    initializeAI();
  </script>
</body>
</html>
