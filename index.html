<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ultimate Smile 3D AR - Auto Scale Fix</title>
  <style>
    body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #111; overflow: hidden; }
    .container { position: relative; width: 640px; height: 480px; }
    video { display: none; }
    #videoCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1); border-radius: 12px; z-index: 1; }
    #threeCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1); border-radius: 12px; z-index: 2; pointer-events: none; }
    .loading { position: absolute; color: white; font-family: sans-serif; z-index: 10; left: 50%; top: 50%; transform: translate(-50%, -50%); }
  </style>
  
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs" type="module"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

  <div class="container">
    <div class="loading" id="loadingText">Loading Engine...</div>
    <video id="webcam" autoplay playsinline></video>
    <canvas id="videoCanvas" width="640" height="480"></canvas>
    <canvas id="threeCanvas" width="640" height="480"></canvas>
  </div>

  <script type="module">
    import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs";

    const video = document.getElementById("webcam");
    const videoCanvas = document.getElementById("videoCanvas");
    const videoCtx = videoCanvas.getContext("2d");
    const threeCanvas = document.getElementById("threeCanvas");
    
    // --- 1. THREE.JS 3D SETUP ---
    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(0, 640, 0, 480, -2000, 2000);
    camera.position.z = 1000;

    const renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, alpha: true, antialias: true });
    renderer.setSize(640, 480);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
    scene.add(ambientLight);
    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.6);
    directionalLight.position.set(0, 1, 1);
    scene.add(directionalLight);

    let teethGroup = new THREE.Group();
    let modelOriginalWidth = 1; // Default fallback

    const loader = new THREE.GLTFLoader();
    loader.load('teeth.glb', function (gltf) {
      const teethModel = gltf.scene;
      
      // Make them bright white e.max material
      teethModel.traverse((child) => {
        if (child.isMesh) {
          child.material = new THREE.MeshStandardMaterial({
            color: 0xffffff,
            roughness: 0.2,
            metalness: 0.1,
          });
        }
      });

      // --- THE FIX: AUTO-CENTERING & MEASURING ---
      // 1. Measure the exact 3D bounding box of the downloaded file
      const box = new THREE.Box3().setFromObject(teethModel);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      
      // 2. Save the true width of the model to calculate exact scaling later
      modelOriginalWidth = size.x;

      // 3. Force the model to the exact center of its own coordinate system
      teethModel.position.x = -center.x;
      teethModel.position.y = -center.y;
      teethModel.position.z = -center.z;

      // 4. Add the centered model to a Group so we can move the Group safely
      teethGroup.add(teethModel);
      scene.add(teethGroup);
      
      teethGroup.visible = false; 
    });

    // --- 2. MEDIAPIPE AI SETUP ---
    let faceLandmarker;
    let lastVideoTime = -1;

    async function initializeAI() {
      const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm");
      faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
        baseOptions: { 
          modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task", 
          delegate: "GPU" 
        },
        runningMode: "VIDEO",
        numFaces: 1
      });
      startCamera();
    }

    async function startCamera() {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
      video.srcObject = stream;
      video.addEventListener("loadeddata", renderLoop);
      document.getElementById("loadingText").style.display = "none";
    }

    // --- 3. EXACT SYNC RENDER LOOP ---
    async function renderLoop() {
      videoCtx.drawImage(video, 0, 0, videoCanvas.width, videoCanvas.height);

      if (video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        const results = faceLandmarker.detectForVideo(video, performance.now());

        if (results.faceLandmarks && results.faceLandmarks.length > 0 && teethGroup.children.length > 0) {
          const landmarks = results.faceLandmarks[0];
          
          // MediaPipe Key Landmarks
          const leftCorner = landmarks[78];
          const rightCorner = landmarks[308];
          const topLipInner = landmarks[13];
          const bottomLipInner = landmarks[14];

          // Calculate mouth dimensions in real pixels
          const mouthWidthPixels = (rightCorner.x - leftCorner.x) * 640;
          const mouthHeightPixels = (bottomLipInner.y - topLipInner.y) * 480;

          // Only show teeth if mouth is slightly open
          if (mouthHeightPixels > 8) {
            teethGroup.visible = true;

            // 1. EXACT POSITIONING: Center between the lip corners
            const centerX = ((leftCorner.x + rightCorner.x) / 2) * 640;
            const centerY = ((topLipInner.y + bottomLipInner.y) / 2) * 480;
            teethGroup.position.set(centerX, centerY, 0);

            // 2. EXACT SCALING: Target width / Original Model Width
            // We multiply by 1.1 so it slightly tucks behind the corners of the lips naturally
            const exactScale = (mouthWidthPixels * 1.1) / modelOriginalWidth;
            teethGroup.scale.set(exactScale, exactScale, exactScale);

            // 3. EXACT ROTATION (Yaw, Pitch, Roll)
            // Yaw: Head turning left/right
            const yaw = Math.atan2(rightCorner.z - leftCorner.z, rightCorner.x - leftCorner.x);
            // Roll: Head tilting side to side
            const roll = Math.atan2(rightCorner.y - leftCorner.y, rightCorner.x - leftCorner.x);
            
            teethGroup.rotation.y = yaw;
            teethGroup.rotation.z = -roll; // Inverse roll to match mirror effect

          } else {
            teethGroup.visible = false;
          }
        }
      }
      
      renderer.render(scene, camera);
      window.requestAnimationFrame(renderLoop);
    }

    initializeAI();
  </script>
</body>
</html>
