<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Teeth VTO Prototype</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "mindar-face-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-three.prod.js"
      }
    }
<script type="module">
  import * as THREE from 'three';
  import { MindARThree } from 'mindar-face-three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

  const mindarThree = new MindARThree({
    container: document.querySelector("#container"),
  });
  const {renderer, scene, camera} = mindarThree;

  // 1. ADD LIGHTS (This fixes the black silhouette)
  const ambientLight = new THREE.AmbientLight(0xffffff, 1);
  scene.add(ambientLight);
  const directionalLight = new THREE.DirectionalLight(0xffffff, 2);
  directionalLight.position.set(0, 1, 1);
  scene.add(directionalLight);

  const anchor = mindarThree.addAnchor(10); 

  const loader = new GLTFLoader();
  loader.load('./teeth.glb', (gltf) => {
    const teeth = gltf.scene;
    // ADJUST THESE NUMBERS TO FIX POSITION
    teeth.scale.set(0.5, 0.5, 0.5); 
    teeth.position.set(0, -0.1, 0.1); // Move: [x, y, z] (y is up/down, z is front/back)
    anchor.group.add(teeth);
  });

  const start = async() => {
    await mindarThree.start();
    renderer.setAnimationLoop(() => {
      renderer.render(scene, camera);
    });
  }
  start();
</script>
</body>
</html>
