<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Teeth VTO Prototype</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "mindar-face-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-three.prod.js"
      }
    }
  </script>
  <style>
    body { margin: 0; }
    #container { width: 100vw; height: 100vh; overflow: hidden; position: relative; }
    #startBtn { position: absolute; z-index: 10; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 20px 40px; font-size: 20px; cursor: pointer; }
  </style>
</head>
<body>
  <button id="startBtn">START 3D VTO</button>
  <div id="container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { MindARThree } from 'mindar-face-three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const mindarThree = new MindARThree({
      container: document.querySelector("#container"),
    });
    const {renderer, scene, camera} = mindarThree;

    // 1. Create the Mouth Anchor
    // Anchor 10 is the mouth region
    const anchor = mindarThree.addAnchor(10); 

    // 2. Load the GLB model
    const loader = new GLTFLoader();
    loader.load('./teeth.glb', (gltf) => {
      const teeth = gltf.scene;
      teeth.scale.set(1, 1, 1); // Adjust if it's too big/small
      teeth.position.set(0, 0, 0); // Center relative to mouth
      anchor.group.add(teeth);
    });

    // 3. Start Button Logic
    document.getElementById("startBtn").onclick = async () => {
      await mindarThree.start();
      document.getElementById("startBtn").style.display = 'none';
      renderer.setAnimationLoop(() => {
        renderer.render(scene, camera);
      });
    };
  </script>
</body>
</html>
