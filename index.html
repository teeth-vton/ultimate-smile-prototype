<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ultimate Smile 3D AR Prototype</title>
  <style>
    body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #111; overflow: hidden; }
    .container { position: relative; width: 640px; height: 480px; }
    video { display: none; }
    /* We still need the 2D canvas for the video background and mouth masking */
    #videoCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1); border-radius: 12px; z-index: 1; }
    /* The 3D canvas sits directly on top */
    #threeCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1); border-radius: 12px; z-index: 2; pointer-events: none; }
    .loading { position: absolute; color: white; font-family: sans-serif; z-index: 10; }
  </style>
  
  <!-- 1. Load MediaPipe for Face Tracking -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs" type="module"></script>
  
  <!-- 2. Load Three.js for 3D Rendering -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

  <div class="container">
    <div class="loading" id="loadingText">Loading 3D Engine & AI...</div>
    <video id="webcam" autoplay playsinline></video>
    <canvas id="videoCanvas" width="640" height="480"></canvas>
    <canvas id="threeCanvas" width="640" height="480"></canvas>
  </div>

  <script type="module">
    import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs";

    const video = document.getElementById("webcam");
    const videoCanvas = document.getElementById("videoCanvas");
    const videoCtx = videoCanvas.getContext("2d");
    
    // --- THREE.JS 3D SETUP ---
    const threeCanvas = document.getElementById("threeCanvas");
    const scene = new THREE.Scene();
    
    // We use an Orthographic camera so the 3D model scales perfectly with the 2D video
    const camera = new THREE.OrthographicCamera(0, 640, 0, 480, -1000, 1000);
    camera.position.z = 500;

    // Make the 3D background transparent so the webcam video shows through
    const renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, alpha: true, antialias: true });
    renderer.setSize(640, 480);

    // Add realistic dental lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8); // Base light
    scene.add(ambientLight);
    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5); // Simulates a camera flash/room light
    directionalLight.position.set(0, 1, 1);
    scene.add(directionalLight);

    let teethModel;

    // Load the 3D Teeth Model
    const loader = new THREE.GLTFLoader();
    loader.load('teeth.glb', function (gltf) {
      teethModel = gltf.scene;
      
      // Apply the "e.max veneer" material to make them look glossy and premium
      teethModel.traverse((child) => {
        if (child.isMesh) {
          child.material = new THREE.MeshStandardMaterial({
            color: 0xffffff, // BL1 / B1 bright white
            roughness: 0.2,  // Glossy like real enamel
            metalness: 0.1,
          });
        }
      });
      
      scene.add(teethModel);
      // Hide initially until mouth opens
      teethModel.visible = false; 
    });

    // --- MEDIAPIPE AI SETUP ---
    let faceLandmarker;
    let lastVideoTime = -1;

    async function initializeAI() {
      const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm");
      faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
        baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task", delegate: "GPU" },
        runningMode: "VIDEO",
        numFaces: 1
      });
      startCamera();
    }

    async function startCamera() {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
      video.srcObject = stream;
      video.addEventListener("loadeddata", renderLoop);
      document.getElementById("loadingText").style.display = "none";
    }

    // --- RENDER LOOP ---
    async function renderLoop() {
      videoCtx.drawImage(video, 0, 0, videoCanvas.width, videoCanvas.height);

      if (video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        const results = faceLandmarker.detectForVideo(video, performance.now());

        if (results.faceLandmarks && results.faceLandmarks.length > 0 && teethModel) {
          const landmarks = results.faceLandmarks[0];
          
          // Get core mouth coordinates
          const leftCorner = landmarks[78];
          const rightCorner = landmarks[308];
          const topLip = landmarks[13];
          const bottomLip = landmarks[14];

          // Calculate mouth size in pixels
          const mouthWidthPixels = (rightCorner.x - leftCorner.x) * 640;
          const mouthHeightPixels = (bottomLip.y - topLip.y) * 480;

          if (mouthHeightPixels > 10) {
            teethModel.visible = true;

            // 1. POSITION: Center the teeth in the mouth
            const centerX = ((leftCorner.x + rightCorner.x) / 2) * 640;
            const centerY = ((topLip.y + bottomLip.y) / 2) * 480;
            teethModel.position.set(centerX, centerY, 0);

            // 2. SCALE: Resize the 3D model to fit the mouth width
            // Note: '50' is a magic number that depends on your specific .glb file's original size. Adjust if teeth are too big/small.
            const scaleFactor = mouthWidthPixels / 50; 
            teethModel.scale.set(scaleFactor, scaleFactor, scaleFactor);

            // 3. ROTATION: Calculate how the head is turning based on the Z-depth of the lips
            // If the left corner is deeper (further away) than the right, the head is turning left.
            const yaw = Math.atan2(rightCorner.z - leftCorner.z, rightCorner.x - leftCorner.x);
            teethModel.rotation.y = yaw; 
            
            // To achieve perfect masking (hiding teeth behind lips), we would apply WebGL stencil masking here.
          } else {
            // Hide teeth if mouth is closed
            teethModel.visible = false;
          }
        }
      }
      
      // Render the 3D scene
      renderer.render(scene, camera);
      window.requestAnimationFrame(renderLoop);
    }

    initializeAI();
  </script>
</body>
</html>
