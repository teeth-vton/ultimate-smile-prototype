<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Teeth Whitening Try-On</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
  <style>
    body { font-family: sans-serif; background: #1a1a1a; color: white; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 20px; }
    #video-container { position: relative; width: 100%; max-width: 640px; border-radius: 10px; overflow: hidden; background: #000; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    /* Flip the video like a mirror */
    video, canvas { width: 100%; height: auto; display: block; transform: scaleX(-1); }
    canvas { position: absolute; top: 0; left: 0; pointer-events: none; }
    .controls { margin-top: 20px; background: #333; padding: 20px; border-radius: 8px; width: 100%; max-width: 600px; }
    input[type=range] { width: 100%; margin-top: 10px; cursor: pointer; }
    .status { margin-bottom: 15px; font-weight: bold; color: #4ade80; text-align: center;}
  </style>
</head>
<body>
  <h2>🦷 Live AR Teeth Whitening</h2>
  
  <div class="controls">
    <div class="status" id="status">Loading AR Model... Please allow camera access.</div>
    <label>Whitening Filter Intensity: <span id="intensity-val">50%</span></label>
    <input type="range" id="intensity" min="0" max="1" step="0.05" value="0.5">
  </div>
  
  <div id="video-container">
    <video id="webcam" autoplay playsinline></video>
    <canvas id="output_canvas"></canvas>
  </div>

  <script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('output_canvas');
    const ctx = canvas.getContext('2d');
    const slider = document.getElementById('intensity');
    const statusText = document.getElementById('status');
    const intensityVal = document.getElementById('intensity-val');

    // Update slider text
    slider.addEventListener('input', (e) => {
      intensityVal.innerText = Math.round(e.target.value * 100) + '%';
    });

    // These specific numbers are the dots around the inner lips in MediaPipe's Face Mesh
    const INNER_LIPS = [78, 191, 80, 81, 82, 13, 312, 311, 310, 415, 308, 324, 318, 402, 317, 14, 87, 178, 88, 95];

    function onResults(results) {
      // Set canvas size to match video
      if (!canvas.width) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        statusText.innerText = "Face Detected! Try smiling.";
      }
      
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        const landmarks = results.multiFaceLandmarks[0];
        
        // Draw a polygon mask over the open mouth
        ctx.beginPath();
        INNER_LIPS.forEach((index, i) => {
          const x = landmarks[index].x * canvas.width;
          const y = landmarks[index].y * canvas.height;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        ctx.closePath();

        // Apply a white color with an 'overlay' blend mode to brighten the teeth
        ctx.fillStyle = `rgba(255, 255, 255, ${slider.value})`;
        ctx.globalCompositeOperation = 'overlay'; 
        ctx.fill();
        
        // Reset blend mode so it doesn't mess up future frames
        ctx.globalCompositeOperation = 'source-over';
      }
    }

    // Initialize Google's Face Mesh
    const faceMesh = new FaceMesh({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`});
    faceMesh.setOptions({ 
      maxNumFaces: 1, 
      refineLandmarks: true, 
      minDetectionConfidence: 0.5, 
      minTrackingConfidence: 0.5 
    });
    faceMesh.onResults(onResults);

    // Start the Webcam
    const camera = new Camera(video, {
      onFrame: async () => { await faceMesh.send({image: video}); },
      width: 640, height: 480
    });
    camera.start();
  </script>
</body>
</html>
