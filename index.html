<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hyper-Realistic Dental AR Engine</title>
  <style>
    body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; overflow: hidden; }
    .canvas-container { position: relative; width: 640px; height: 480px; border-radius: 16px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.9); }
    #webcamCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1); }
    #threeCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1); pointer-events: none; }
    video { display: none; }
    #loadingOverlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #111; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; color: white; }
    #startBtn { padding: 14px 35px; font-size: 16px; font-weight: bold; background: #fff; color: #000; border: none; border-radius: 25px; cursor: pointer; margin-top: 15px; }
    #startBtn:disabled { background: #444; color: #888; cursor: not-allowed; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs" type="module"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

  <div class="canvas-container">
    <canvas id="webcamCanvas" width="640" height="480"></canvas>
    <canvas id="threeCanvas" width="640" height="480"></canvas>
    
    <div id="loadingOverlay">
      <h3 style="margin:0;">DENTAL TRY-ON ENGINE</h3>
      <button id="startBtn" disabled>Loading 3D Assets...</button>
    </div>
  </div>

  <video id="webcam" autoplay playsinline crossorigin="anonymous"></video>

  <script type="module">
    import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs";

    const video = document.getElementById("webcam");
    const webcamCanvas = document.getElementById("webcamCanvas");
    const webcamCtx = webcamCanvas.getContext("2d");
    const threeCanvas = document.getElementById("threeCanvas");
    const startBtn = document.getElementById("startBtn");
    const loadingOverlay = document.getElementById("loadingOverlay");

    // --- 1. PROPER PERSPECTIVE 3D ENGINE ---
    const scene = new THREE.Scene();
    
    // Using a 45-degree Perspective camera matches standard webcam focal depth distortion
    const camera = new THREE.PerspectiveCamera(45, 640 / 480, 0.1, 1000);
    camera.position.set(0, 0, 0); // Camera sits at origin; we move objects out in negative Z space

    const renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, alpha: true, antialias: true });
    renderer.setSize(640, 480);
    renderer.setPixelRatio(window.devicePixelRatio);

    scene.add(new THREE.AmbientLight(0xffffff, 1.4));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(0, 40, 100);
    scene.add(dirLight);

    let upperJaw = new THREE.Group();
    let lowerJaw = new THREE.Group();
    let dentalKit = new THREE.Group();
    
    dentalKit.add(upperJaw);
    dentalKit.add(lowerJaw);
    scene.add(dentalKit);

    let isModelReady = false;
    let baseModelWidth = 1;

    const loader = new THREE.GLTFLoader();
    loader.load('teeth.glb?nocache=' + Date.now(), function (gltf) {
      const model = gltf.scene;

      // Find precise structural center
      const box = new THREE.Box3().setFromObject(model);
      const center = new THREE.Vector3();
      box.getCenter(center);
      const size = new THREE.Vector3();
      box.getSize(size);
      
      baseModelWidth = size.x;

      model.traverse((child) => {
        if (child.isMesh) {
          // Re-write materials to avoid broken vertex colors causing gray blobs
          child.material = new THREE.MeshPhysicalMaterial({
            color: child.material.color || new THREE.Color(0xffffff),
            roughness: 0.1,
            metalness: 0.0,
            clearcoat: 1.0,
            clearcoatRoughness: 0.02
          });
          child.material.vertexColors = false;

          // Align internal geometry structure relative to its pivot group
          const childBox = new THREE.Box3().setFromObject(child);
          const childCenter = new THREE.Vector3();
          childBox.getCenter(childCenter);
          
          child.position.sub(center);

          // Separate upper and lower arches via geometric midline split
          if (childCenter.y > center.y) {
            upperJaw.add(child);
          } else {
            lowerJaw.add(child);
          }
        }
      });

      isModelReady = true;
      startBtn.disabled = false;
      startBtn.innerText = "Open AR Mirror";
    });

    // --- 2. FACE TRACKING INITIALIZATION ---
    let faceLandmarker;
    let lastVideoTime = -1;
    
    // The exact 20 points defining the inner line of the lips
    const INNER_LIP_PATH = [78, 191, 80, 81, 82, 13, 312, 311, 310, 415, 308, 324, 318, 402, 317, 14, 87, 178, 88, 95];

    async function initAI() {
      const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm");
      faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
        baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task", delegate: "GPU" },
        runningMode: "VIDEO",
        numFaces: 1
      });
    }

    startBtn.addEventListener("click", async () => {
      loadingOverlay.style.display = "none";
      const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, facingMode: "user" } });
      video.srcObject = stream;
      video.addEventListener("loadeddata", () => {
        window.requestAnimationFrame(renderLoop);
      });
    });

    // --- 3. RENDERING & DEPTH PROJECTION LOOP ---
    function renderLoop() {
      if (video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        const results = faceLandmarker.detectForVideo(video, performance.now());

        // Stream background frame
        webcamCtx.drawImage(video, 0, 0, 640, 480);

        if (results.faceLandmarks && results.faceLandmarks.length > 0) {
          const landmarks = results.faceLandmarks[0];

          const leftCorner = landmarks[78];
          const rightCorner = landmarks[308];
          const topLipInner = landmarks[13];
          const bottomLipInner = landmarks[14];

          // Calculate real pixel values
          const mouthWidthPx = Math.abs(rightCorner.x - leftCorner.x) * 640;
          const mouthHeightPx = Math.abs(bottomLipInner.y - topLipInner.y) * 480;

          if (mouthHeightPx > 3) {
            upperJaw.visible = true;
            lowerJaw.visible = true;

            // Compute depth calculation (Z axis) based on facial dimensions
            // Prevents scaling distortions when moving closer/further from screen
            const distanceFactor = 35 / (mouthWidthPx / 640); 
            
            // Map 2D Screen points directly to 3D Viewport Space coordinates
            const transformX = ((leftCorner.x + rightCorner.x) / 2 - 0.5) * (640 / 480) * distanceFactor;
            const transformUpperY = (0.5 - topLipInner.y) * distanceFactor;
            const transformLowerY = (0.5 - bottomLipInner.y) * distanceFactor;

            // Apply consistent global uniform sizing
            const scaleTarget = (mouthWidthPx / baseModelWidth) * 0.095;
            dentalKit.scale.set(scaleTarget, scaleTarget, scaleTarget);

            // Position jaws to follow their respective anchor points independently
            upperJaw.position.set(transformX, transformUpperY, -distanceFactor);
            lowerJaw.position.set(transformX, transformLowerY, -distanceFactor);

            // Compute head rotation angles
            const yaw = Math.atan2(rightCorner.z - leftCorner.z, rightCorner.x - leftCorner.x);
            const roll = Math.atan2(rightCorner.y - leftCorner.y, rightCorner.x - leftCorner.x);
            
            upperJaw.rotation.set(0, yaw, -roll);
            lowerJaw.rotation.set(0, yaw, -roll);

            renderer.render(scene, camera);

            // --- SHARP BOUNDARY OCCLUSION MASK ---
            // Only renders teeth showing through the open area of the lips
            webcamCtx.save();
            webcamCtx.beginPath();
            INNER_LIP_PATH.forEach((idx, i) => {
              const pt = landmarks[idx];
              if (i === 0) webcamCtx.moveTo(pt.x * 640, pt.y * 480);
              else webcamCtx.lineTo(pt.x * 640, pt.y * 480);
            });
            webcamCtx.closePath();
            webcamCtx.clip();

            // Overlay calibrated 3D layers inside the clipped lip opening
            webcamCtx.drawImage(threeCanvas, 0, 0, 640, 480);
            webcamCtx.restore();
          } else {
            upperJaw.visible = false;
            lowerJaw.visible = false;
          }
        }
      }
      window.requestAnimationFrame(renderLoop);
    }

    initAI();
  </script>
</body>
</html>
