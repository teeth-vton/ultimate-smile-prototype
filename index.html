<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ultimate Enterprise AR Teeth Whitening</title>
  <style>
    body { 
      margin: 0; 
      background-color: #0f172a; 
      color: #f8fafc; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }

    h1 { margin-top: 0; font-size: 1.5rem; color: #38bdf8; text-transform: uppercase; letter-spacing: 1px;}

    #webar-player { 
      width: 100%; 
      max-width: 720px; 
      border-radius: 16px; 
      overflow: hidden; 
      box-shadow: 0 20px 40px rgba(0,0,0,0.9); 
      background: #000; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      aspect-ratio: 4/3;
      border: 2px solid #334155;
      position: relative;
    }

    #start-btn { 
      padding: 16px 32px; 
      font-size: 1.2rem; 
      font-weight: 800; 
      cursor: pointer; 
      background: #10b981; 
      color: #fff; 
      border: none; 
      border-radius: 12px; 
      margin-bottom: 20px;
      transition: all 0.2s ease-in-out;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
    }
    #start-btn:hover { background: #059669; transform: translateY(-2px); }
    #start-btn:disabled { background: #475569; cursor: not-allowed; transform: none; box-shadow: none;}

    #debug-console {
      width: 100%;
      max-width: 720px;
      background: #1e293b;
      border-radius: 8px;
      padding: 15px;
      margin-top: 20px;
      font-family: monospace;
      font-size: 0.9rem;
      height: 200px;
      overflow-y: auto;
      border: 1px solid #475569;
      box-sizing: border-box;
    }
    .log-line { margin: 4px 0; border-bottom: 1px solid #334155; padding-bottom: 4px; }
    .log-info { color: #38bdf8; }
    .log-success { color: #10b981; font-weight: bold; }
    .log-error { color: #ef4444; font-weight: bold; background: rgba(239, 68, 68, 0.1); padding: 4px; }
    .log-warn { color: #f59e0b; }
  </style>
</head>

  <div id="webar-player"></div>

  </div>

      const line = document.createElement('div');
      line.className = `log-line log-${type}`;
      const time = new Date().toLocaleTimeString();
      line.innerText = `[${time}] ${message}`;
      debugConsole.appendChild(line);
      debugConsole.scrollTop = debugConsole.scrollHeight; 
      console.log(`[${type.toUpperCase()}] ${message}`);
    }

    window.onerror = function(msg, url, lineNo, columnNo, error) {
      logToScreen(`CRITICAL ERROR: ${msg}`, 'error');
      return false;
    };

    import { Webcam, Player, Module, Effect, Dom } from 'https://cdn.jsdelivr.net/npm/@banuba/webar@1.18.1/dist/BanubaSDK.browser.esm.js';

        await player.addModule(new Module('https://cdn.jsdelivr.net/npm/@banuba/webar@1.18.1/dist/modules/face_tracker.zip'));

        logToScreen("Requesting camera access natively through Banuba...", "info");
        await player.use(new Webcam());

        logToScreen("Fetching local file: './TeethWitening_Toggle.zip'...", "info");

        logToScreen("Starting live video feed loop...", "info");
        player.play();

        startBtn.style.display = 'none';
        logToScreen("SYSTEM ONLINE. Virtual Try-On is running.", "success");

      } catch (error) {
        startBtn.innerText = "Error - Check Logs";
        logToScreen("SYSTEM HALTED DUE TO ERROR:", "error");
        logToScreen(error.message || JSON.stringify(error), "error");
      }
    }

    document.getElementById('start-btn').addEventListener('click', startVirtualTryOn);
  </script>
</body>
</html>
