<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Teeth VTO - Verification</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "mindar-face-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-three.prod.js"
      }
    }
  </script>
  <style>
    body { margin: 0; background: #000; }
    #container { width: 100vw; height: 100vh; position: relative; }
    #startBtn { position: absolute; z-index: 10; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 20px 40px; font-size: 20px; cursor: pointer; }
  </style>
</head>
<body>
  <button id="startBtn">START VTO</button>
  <div id="container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { MindARThree } from 'mindar-face-three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const mindarThree = new MindARThree({ container: document.querySelector("#container") });
    const { renderer, scene, camera } = mindarThree;

    // Lights - MUST HAVE for 3D visibility
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
    scene.add(ambientLight);

    // Anchor to the mouth (Index 10)
    const anchor = mindarThree.addAnchor(10); 
    
    const loader = new GLTFLoader();
    loader.load('./teeth.glb', (gltf) => {
      const teeth = gltf.scene;
      // Make it LARGE to ensure we can see it
      teeth.scale.set(5, 5, 5); 
      // Offset from anchor
      teeth.position.set(0, -0.2, 0); 
      anchor.group.add(teeth);
    });

    document.getElementById("startBtn").onclick = async () => {
      await mindarThree.start();
      document.getElementById("startBtn").style.display = 'none';
      renderer.setAnimationLoop(() => {
        renderer.render(scene, camera);
      });
    };
  </script>
</body>
</html>
