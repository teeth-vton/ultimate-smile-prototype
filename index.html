<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ultimate Smile Design - Master Calibration</title>
  <style>
    body { margin: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; background-color: #050505; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    
    .ar-window { position: relative; width: 640px; height: 480px; border-radius: 16px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.5); background: #111; z-index: 1; }
    video, #threeCanvas { display: none; } 
    #mainCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1); }
    
    /* Splash Screen */
    #uiOverlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; color: white; text-align: center; }
    #startButton { padding: 16px 40px; font-size: 16px; font-weight: bold; background: #ffffff; color: #000; border: none; border-radius: 50px; cursor: pointer; transition: all 0.3s ease; }
    #startButton:hover { transform: scale(1.05); }
    #statusText { font-size: 14px; color: #ddd; margin-top: 15px; }

    /* Developer Calibration Panel */
    .controls { width: 640px; background: #1a1a1a; padding: 15px; box-sizing: border-box; margin-top: 15px; color: white; border-radius: 12px; display: none; z-index: 2; }
    .control-group { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    label { font-size: 12px; width: 140px; font-weight: bold; color: #ccc; }
    input[type=range] { flex-grow: 1; margin: 0 15px; }
    span.val { width: 50px; text-align: right; font-size: 12px; font-weight: bold; color: #4CAF50; }
    .section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #777; margin-bottom: 8px; border-bottom: 1px solid #333; padding-bottom: 4px; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs" type="module"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

  <div class="ar-window">
    <canvas id="mainCanvas" width="640" height="480"></canvas>
    
    <div id="uiOverlay">
      <h2 style="margin-bottom: 5px;">Ultimate Smile Dev</h2>
      <p style="font-size: 12px; color: #aaa; margin-bottom: 20px;">Model Calibration Mode</p>
      <button id="startButton">Loading Fresh Asset...</button>
      <div id="statusText">Bypassing Browser Cache...</div>
    </div>

    <video id="webcam" autoplay playsinline crossorigin="anonymous"></video>
    <canvas id="threeCanvas" width="640" height="480"></canvas>
  </div>

  <div class="controls" id="controlsPanel">
    <div class="section-title">Model Structural Fixes</div>
    <div class="control-group">
      <label>Base Scale Adjust</label>
      <input type="range" id="scaleSlider" min="0.1" max="4.0" step="0.1" value="1.0">
      <span class="val" id="scaleVal">1.0x</span>
    </div>
    <div class="control-group">
      <label>Pitch (Up/Down Facing)</label>
      <input type="range" id="pitchSlider" min="-180" max="180" step="5" value="0">
      <span class="val" id="pitchVal">0°</span>
    </div>
    <div class="control-group">
      <label>Vertical Position</label>
      <input type="range" id="ySlider" min="-100" max="100" step="1" value="0">
      <span class="val" id="yVal">0px</span>
    </div>
  </div>

  <script type="module">
    import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs";

    const video = document.getElementById("webcam");
    const mainCanvas = document.getElementById("mainCanvas");
    const mainCtx = mainCanvas.getContext("2d");
    const threeCanvas = document.getElementById("threeCanvas");
    const uiOverlay = document.getElementById("uiOverlay");
    const startButton = document.getElementById("startButton");
    const statusText = document.getElementById("statusText");
    const controlsPanel = document.getElementById("controlsPanel");

    // UI Calibration Variables
    let calibScale = 1.0;
    let calibPitch = 0; // In degrees
    let calibYOffset = 0;

    document.getElementById('scaleSlider').addEventListener('input', (e) => { calibScale = parseFloat(e.target.value); document.getElementById('scaleVal').innerText = calibScale.toFixed(1) + 'x'; });
    document.getElementById('pitchSlider').addEventListener('input', (e) => { calibPitch = parseInt(e.target.value); document.getElementById('pitchVal').innerText = calibPitch + '°'; });
    document.getElementById('ySlider').addEventListener('input', (e) => { calibYOffset = parseInt(e.target.value); document.getElementById('yVal').innerText = calibYOffset + 'px'; });

    // --- THREE.JS SETUP ---
    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-320, 320, 240, -240, -2000, 2000);
    camera.position.z = 1000;

    const renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, alpha: true, antialias: true });
    renderer.setSize(640, 480);

    const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
    scene.add(ambientLight);
    const directionalLight = new THREE.DirectionalLight(0xffffff, 1.0);
    directionalLight.position.set(0, 50, 200);
    scene.add(directionalLight);

    let upperGroup = new THREE.Group();
    let lowerGroup = new THREE.Group();
    
    // We wrap them in a master container to easily apply the pitch/rotation fixes
    let masterJawContainer = new THREE.Group();
    masterJawContainer.add(upperGroup);
    masterJawContainer.add(lowerGroup);
    scene.add(masterJawContainer);

    let modelOriginalWidth = 1;
    let isModelReady = false;

    const premiumEnamelMaterial = new THREE.MeshPhysicalMaterial({
      color: 0xffffff, roughness: 0.1, metalness: 0.0,
      clearcoat: 1.0, clearcoatRoughness: 0.05
    });

    const loader = new THREE.GLTFLoader();
    
    // CACHE BUSTER: The "?nocache=" forces Vercel and the browser to download the freshest file
    const fileUrl = 'teeth.glb?nocache=' + Date.now();
    
    loader.load(fileUrl, function (gltf) {
      // 1. Calculate the bounding box of whatever messy file the artist created
      const overallBox = new THREE.Box3().setFromObject(gltf.scene);
      const overallCenter = overallBox.getCenter(new THREE.Vector3());
      modelOriginalWidth = overallBox.getSize(new THREE.Vector3()).x;

      // Force world matrices to update before extraction
      gltf.scene.updateMatrixWorld(true);

      // 2. THE MATRIX BAKER: Extract geometry, delete bad artist code, center perfectly
      gltf.scene.traverse((child) => {
        if (child.isMesh) {
          const childBox = new THREE.Box3().setFromObject(child);
          const childCenter = childBox.getCenter(new THREE.Vector3());

          // Clone the raw shape and bake the world position into the vertices
          const cleanGeometry = child.geometry.clone();
          cleanGeometry.applyMatrix4(child.matrixWorld);

          // Translate the geometry so it pivots exactly around 0,0,0
          cleanGeometry.translate(-overallCenter.x, -overallCenter.y, -overallCenter.z);

          const cleanMesh = new THREE.Mesh(cleanGeometry, premiumEnamelMaterial);

          if (childCenter.y > overallCenter.y) {
            upperGroup.add(cleanMesh);
          } else {
            lowerGroup.add(cleanMesh);
          }
        }
      });

      upperGroup.visible = false;
      lowerGroup.visible = false;
      
      isModelReady = true;
      startButton.innerText = "Start Camera";
      statusText.innerText = "Newest 3D Asset Loaded Successfully";
    });

    // --- MEDIAPIPE AI SETUP ---
    let faceLandmarker;
    let lastVideoTime = -1;
    let isARActive = false;

    const INNER_LIP_CONTOUR = [78, 191, 80, 81, 82, 13, 312, 311, 310, 415, 308, 324, 318, 402, 317, 14, 87, 178, 88, 95];

    let smoothWidth = 0, smoothCenterX = 0;
    let smoothTopY = 0, smoothBottomY = 0;
    let smoothYaw = 0, smoothRoll = 0, smoothLateralShift = 0;
    const EMA_ALPHA = 0.3; 

    async function initializeAI() {
      const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm");
      faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
        baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task", delegate: "GPU" },
        runningMode: "VIDEO",
        numFaces: 1
      });
    }

    startButton.addEventListener("click", async () => {
      if (!isModelReady) return;
      startButton.style.display = "none";
      statusText.innerText = "Connecting secure camera feed...";
      
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
        video.srcObject = stream;
        video.addEventListener("loadeddata", () => {
          uiOverlay.style.display = "none";
          controlsPanel.style.display = "block"; // Open calibration panel
          isARActive = true;
          renderLoop();
        });
      } catch (err) {
        statusText.innerText = "Camera access denied.";
      }
    });

    // --- RENDER LOOP ---
    function renderLoop() {
      if (video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        const results = faceLandmarker.detectForVideo(video, performance.now());

        mainCtx.drawImage(video, 0, 0, 640, 480);

        if (isARActive && results.faceLandmarks && results.faceLandmarks.length > 0) {
          const lm = results.faceLandmarks[0];
          
          const leftCorner = lm[78], rightCorner = lm[308];
          const topLip = lm[13], bottomLip = lm[14];
          const noseTip = lm[4], chinTip = lm[152];

          const rawMouthWidth = (rightCorner.x - leftCorner.x) * 640;
          const rawMouthHeight = (bottomLip.y - topLip.y) * 480;
          const rawCenterX = ((leftCorner.x + rightCorner.x) / 2) * 640;
          const rawTopY = topLip.y * 480;
          const rawBottomY = bottomLip.y * 480;
          
          const rawYaw = Math.atan2(rightCorner.z - leftCorner.z, rightCorner.x - leftCorner.x);
          const rawRoll = Math.atan2(rightCorner.y - leftCorner.y, rightCorner.x - leftCorner.x);
          const rawLateralShift = (chinTip.x - noseTip.x) * 640; 

          smoothWidth = (rawMouthWidth * EMA_ALPHA) + (smoothWidth * (1 - EMA_ALPHA));
          smoothCenterX = (rawCenterX * EMA_ALPHA) + (smoothCenterX * (1 - EMA_ALPHA));
          smoothTopY = (rawTopY * EMA_ALPHA) + (smoothTopY * (1 - EMA_ALPHA));
          smoothBottomY = (rawBottomY * EMA_ALPHA) + (smoothBottomY * (1 - EMA_ALPHA));
          smoothYaw = (rawYaw * EMA_ALPHA) + (smoothYaw * (1 - EMA_ALPHA));
          smoothRoll = (rawRoll * EMA_ALPHA) + (smoothRoll * (1 - EMA_ALPHA));
          smoothLateralShift = (rawLateralShift * EMA_ALPHA) + (smoothLateralShift * (1 - EMA_ALPHA));

          if (rawMouthHeight > 8) {
            upperGroup.visible = true;
            lowerGroup.visible = true;

            // Apply anatomical sizing + the developer custom multiplier
            const exactScale = ((smoothWidth * 1.05) / modelOriginalWidth) * calibScale;
            masterJawContainer.scale.set(exactScale, exactScale, exactScale);

            // Apply Developer Pitch (to fix upside down or floor-facing models)
            masterJawContainer.rotation.x = calibPitch * (Math.PI / 180);

            const threeX = smoothCenterX - 320;
            const threeUpperY = 240 - smoothTopY;
            const threeLowerY = 240 - smoothBottomY;

            // Anchor upper jaw, apply developer Y Offset
            upperGroup.position.set(threeX, threeUpperY + calibYOffset, 0);
            
            // Anchor lower jaw to chin drop
            lowerGroup.position.set(threeX + smoothLateralShift, threeLowerY + calibYOffset, 0);

            // Head tracking rotations
            upperGroup.rotation.set(0, smoothYaw, -smoothRoll);
            
            // TMJ Jaw dropping physics
            const mouthOpenness = smoothBottomY - smoothTopY;
            const jawTiltX = Math.max(0, mouthOpenness * 0.015);
            lowerGroup.rotation.set(-jawTiltX, smoothYaw, -smoothRoll);

            renderer.render(scene, camera);

            // Stencil Mask
            mainCtx.save();
            mainCtx.beginPath();
            INNER_LIP_CONTOUR.forEach((idx, i) => {
              const pt = lm[idx];
              if (i === 0) mainCtx.moveTo(pt.x * 640, pt.y * 480);
              else mainCtx.lineTo(pt.x * 640, pt.y * 480);
            });
            mainCtx.closePath();
            mainCtx.clip(); 

            mainCtx.drawImage(threeCanvas, 0, 0, 640, 480);
            mainCtx.restore();
          } else {
            upperGroup.visible = false;
            lowerGroup.visible = false;
          }
        }
      }
      window.requestAnimationFrame(renderLoop);
    }

    initializeAI();
  </script>
</body>
</html>
