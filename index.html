<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ultimate Smile Design - Stabilized Pro AR</title>
  <style>
    body { margin: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; background-color: #111; font-family: sans-serif; overflow: hidden; }
    
    .ar-window { position: relative; width: 640px; height: 480px; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
    video, #threeCanvas { display: none; } 
    #mainCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1); }
    
    /* Splash Screen */
    #uiOverlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; color: white; text-align: center; }
    #startButton { padding: 15px 30px; font-size: 18px; font-weight: bold; background: #fff; color: #000; border: none; border-radius: 30px; cursor: pointer; transition: 0.3s; }
    #startButton:hover { background: #ddd; transform: scale(1.05); }
    
    /* Advanced Control Panel */
    .controls { width: 640px; background: #222; padding: 20px; box-sizing: border-box; margin-top: 15px; color: white; border-radius: 12px; display: none; }
    .control-group { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    label { font-size: 14px; width: 150px; font-weight: bold; color: #ccc; }
    input[type=range] { flex-grow: 1; margin: 0 15px; }
    span.val { width: 55px; text-align: right; font-size: 14px; font-weight: bold; color: #4CAF50; }
    .section-title { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #888; margin-bottom: 10px; border-bottom: 1px solid #333; padding-bottom: 5px; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs" type="module"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

  <div class="ar-window">
    <canvas id="mainCanvas" width="640" height="480"></canvas>
    
    <div id="uiOverlay">
      <button id="startButton">Launch Stabilized AR Engine</button>
      <div id="statusText" style="margin-top:15px; display:none;">Calibrating Face Landmarks...</div>
    </div>

    <video id="webcam" autoplay playsinline crossorigin="anonymous"></video>
    <canvas id="threeCanvas" width="640" height="480"></canvas>
  </div>

  <div class="controls" id="controlsPanel">
    <div class="section-title">Anatomical Scaling & Alignment</div>
    <div class="control-group">
      <label>Teeth Model Width</label>
      <input type="range" id="scaleSlider" min="0.4" max="3.0" step="0.02" value="1.3">
      <span class="val" id="scaleVal">1.30x</span>
    </div>
    <div class="control-group">
      <label>Teeth Vertical Depth</label>
      <input type="range" id="ySlider" min="-60" max="60" step="1" value="5">
      <span class="val" id="yVal">5px</span>
    </div>
    
    <div class="section-title">Tracking Filters & Sensitivity</div>
    <div class="control-group">
      <label>Mouth Open Threshold</label>
      <input type="range" id="thresholdSlider" min="4" max="25" step="1" value="10">
      <span class="val" id="thresholdVal">10px</span>
    </div>
  </div>

  <script type="module">
    import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs";

    const video = document.getElementById("webcam");
    const mainCanvas = document.getElementById("mainCanvas");
    const mainCtx = mainCanvas.getContext("2d");
    const threeCanvas = document.getElementById("threeCanvas");
    
    const startButton = document.getElementById("startButton");
    const uiOverlay = document.getElementById("uiOverlay");
    const controlsPanel = document.getElementById("controlsPanel");

    // --- TUNING OVERRIDES ---
    let customScale = 1.30;
    let customYOffset = 5;
    let activationThreshold = 10; // Ignore micro lip movements to stop premature showing

    // --- SMOOTHING MEMORY BUFFERS (THE ANTI-FLICKER SYSTEM) ---
    let smoothMouthWidth = 0;
    let smoothMouthHeight = 0;
    let smoothCenterX = 0;
    let smoothTopY = 0;
    let smoothBottomY = 0;
    let smoothYaw = 0;
    let smoothRoll = 0;
    
    // 0.25 means 25% new frame data, 75% mathematical memory history. Dampens jitter completely.
    const SMOOTHING_FACTOR = 0.25; 

    // UI Panel Event Interceptors
    document.getElementById('scaleSlider').addEventListener('input', (e) => { customScale = parseFloat(e.target.value); document.getElementById('scaleVal').innerText = customScale.toFixed(2) + 'x'; });
    document.getElementById('ySlider').addEventListener('input', (e) => { customYOffset = parseInt(e.target.value); document.getElementById('yVal').innerText = customYOffset + 'px'; });
    document.getElementById('thresholdSlider').addEventListener('input', (e) => { activationThreshold = parseInt(e.target.value); document.getElementById('thresholdVal').innerText = activationThreshold + 'px'; });

    // --- THREE.JS GRAPHICS SETUP ---
    const scene = new THREE.Scene();
    const camera = new THREE.OrthographicCamera(-320, 320, 240, -240, -2000, 2000);
    camera.position.z = 1000;

    const renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, alpha: true, antialias: true });
    renderer.setSize(640, 480);

    const ambientLight = new THREE.AmbientLight(0xffffff, 1.3);
    scene.add(ambientLight);
    const directionalLight = new THREE.DirectionalLight(0xffffff, 0.7);
    directionalLight.position.set(0, 150, 400);
    scene.add(directionalLight);

    let upperGroup = new THREE.Group();
    let lowerGroup = new THREE.Group();
    scene.add(upperGroup);
    scene.add(lowerGroup);

    let modelOriginalWidth = 1;
    let isModelLoaded = false;

    const veneerMaterial = new THREE.MeshPhysicalMaterial({
      color: 0xffffff, 
      roughness: 0.12, 
      metalness: 0.0,
      clearcoat: 1.0, 
      clearcoatRoughness: 0.08,
      transmission: 0.25,
      ior: 1.5,
      thickness: 1.2
    });

    const loader = new THREE.GLTFLoader();
    loader.load('teeth.glb', function (gltf) {
      const mainModel = gltf.scene;
      const overallBox = new THREE.Box3().setFromObject(mainModel);
      const overallCenter = overallBox.getCenter(new THREE.Vector3());
      const overallSize = overallBox.getSize(new THREE.Vector3());
      modelOriginalWidth = overallSize.x;

      const upperMeshes = [];
      const lowerMeshes = [];

      mainModel.traverse((child) => {
        if (child.isMesh) {
          child.material = veneerMaterial;
          const childBox = new THREE.Box3().setFromObject(child);
          const childCenter = childBox.getCenter(new THREE.Vector3());
          if (childCenter.y > overallCenter.y) upperMeshes.push(child);
          else lowerMeshes.push(child);
        }
      });

      upperMeshes.forEach(mesh => { mesh.position.sub(overallCenter); upperGroup.add(mesh); });
      lowerMeshes.forEach(mesh => { mesh.position.sub(overallCenter); lowerGroup.add(mesh); });

      upperGroup.visible = false;
      lowerGroup.visible = false;
      isModelLoaded = true;
    });

    // --- MEDIAPIPE CORE ---
    let faceLandmarker;
    let lastVideoTime = -1;
    let isARActive = false;

    const INNER_LIP = [78, 191, 80, 81, 82, 13, 312, 311, 310, 415, 308, 324, 318, 402, 317, 14, 87, 178, 88, 95];

    async function initializeAI() {
      const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm");
      faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
        baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task", delegate: "GPU" },
        runningMode: "VIDEO",
        numFaces: 1
      });
    }

    startButton.addEventListener("click", async () => {
      if (!isModelLoaded) return;
      uiOverlay.style.display = "none";
      controlsPanel.style.display = "block";
      
      const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
      video.srcObject = stream;
      video.addEventListener("loadeddata", () => {
        isARActive = true;
        renderLoop();
      });
    });

    // --- DYNAMIC STABILIZED LOOP ---
    function renderLoop() {
      if (video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        const results = faceLandmarker.detectForVideo(video, performance.now());

        mainCtx.drawImage(video, 0, 0, 640, 480);

        if (isARActive && results.faceLandmarks && results.faceLandmarks.length > 0) {
          const landmarks = results.faceLandmarks[0];
          
          const leftCorner = landmarks[78];
          const rightCorner = landmarks[308];
          const topLipInner = landmarks[13];
          const bottomLipInner = landmarks[14];

          // Raw Frame Readings
          const rawMouthWidth = (rightCorner.x - leftCorner.x) * 640;
          const rawMouthHeight = (bottomLipInner.y - topLipInner.y) * 480;
          const rawCenterX = ((leftCorner.x + rightCorner.x) / 2) * 640;
          const rawTopY = topLipInner.y * 480;
          const rawBottomY = bottomLipInner.y * 480;
          const rawYaw = Math.atan2(rightCorner.z - leftCorner.z, rightCorner.x - leftCorner.x);
          const rawRoll = Math.atan2(rightCorner.y - leftCorner.y, rightCorner.x - leftCorner.x);

          // Apply Exponential Moving Average Mathematical Filter to kill left/right flickering
          smoothMouthWidth = (rawMouthWidth * SMOOTHING_FACTOR) + (smoothMouthWidth * (1 - SMOOTHING_FACTOR));
          smoothMouthHeight = (rawMouthHeight * SMOOTHING_FACTOR) + (smoothMouthHeight * (1 - SMOOTHING_FACTOR));
          smoothCenterX = (rawCenterX * SMOOTHING_FACTOR) + (smoothCenterX * (1 - SMOOTHING_FACTOR));
          smoothTopY = (rawTopY * SMOOTHING_FACTOR) + (smoothTopY * (1 - SMOOTHING_FACTOR));
          smoothBottomY = (rawBottomY * SMOOTHING_FACTOR) + (smoothBottomY * (1 - SMOOTHING_FACTOR));
          smoothYaw = (rawYaw * SMOOTHING_FACTOR) + (smoothYaw * (1 - SMOOTHING_FACTOR));
          smoothRoll = (rawRoll * SMOOTHING_FACTOR) + (smoothRoll * (1 - SMOOTHING_FACTOR));

          // Enforce Mouth Open Activation Threshold
          if (smoothMouthHeight > activationThreshold) {
            upperGroup.visible = true;
            lowerGroup.visible = true;

            // Apply size tuning slider to scale structural bounding gaps
            const exactScale = (smoothMouthWidth / modelOriginalWidth) * customScale;
            upperGroup.scale.set(exactScale, exactScale, exactScale);
            lowerGroup.scale.set(exactScale, exactScale, exactScale);

            // Bind tracking groups cleanly to smoothed tracking coordinates plus custom offset overrides
            upperGroup.position.set(smoothCenterX - 320, (240 - smoothTopY) + customYOffset, 0);
            lowerGroup.position.set(smoothCenterX - 320, (240 - smoothBottomY) + customYOffset, 0);

            upperGroup.rotation.y = smoothYaw;
            upperGroup.rotation.z = -smoothRoll;
            lowerGroup.rotation.y = smoothYaw;
            lowerGroup.rotation.z = -smoothRoll;

            renderer.render(scene, camera);

            // Stencil Clipping Mask
            mainCtx.save();
            mainCtx.beginPath();
            INNER_LIP.forEach((idx, i) => {
              const pt = landmarks[idx];
              if (i === 0) mainCtx.moveTo(pt.x * 640, pt.y * 480);
              else mainCtx.lineTo(pt.x * 640, pt.y * 480);
            });
            mainCtx.closePath();
            mainCtx.clip(); 

            mainCtx.drawImage(threeCanvas, 0, 0, 640, 480);
            mainCtx.restore();
          } else {
            upperGroup.visible = false;
            lowerGroup.visible = false;
          }
        }
      }
      window.requestAnimationFrame(renderLoop);
    }

    initializeAI();
  </script>
</body>
</html>
