<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Teeth VTO - Debug Enabled</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "mindar-face-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-three.prod.js"
      }
    }
  </script>
  <style>
    body { margin: 0; background: #000; }
    #container { width: 100vw; height: 100vh; position: relative; }
    #startBtn { position: absolute; z-index: 10; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 20px 40px; font-size: 20px; cursor: pointer; }
  </style>
</head>
<body>
  <button id="startBtn">INITIALIZE 3D ENGINE</button>
  <div id="container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { MindARThree } from 'mindar-face-three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const container = document.querySelector("#container");
    const mindarThree = new MindARThree({ container: container });
    const { renderer, scene, camera } = mindarThree;

    // Lights
    const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
    scene.add(light);

    const anchor = mindarThree.addAnchor(10); 
    let teethModel;

    // Load Model with Error Handling
    const loader = new GLTFLoader();
    loader.load(
      './teeth.glb', 
      (gltf) => {
        teethModel = gltf.scene;
        teethModel.scale.set(0.5, 0.5, 0.5); 
        teethModel.position.set(0, -0.6, 0.05); 
        teethModel.visible = false; 
        anchor.group.add(teethModel);
        console.log("Model loaded successfully!");
      },
      (xhr) => console.log((xhr.loaded / xhr.total * 100) + '% loaded'),
      (error) => console.error('An error happened loading the GLB:', error)
    );

    document.getElementById("startBtn").onclick = async () => {
      try {
        await mindarThree.start();
        document.getElementById("startBtn").style.display = 'none';

        renderer.setAnimationLoop(() => {
          if (teethModel) {
            // MOUTH OPENING LOGIC
            // MindAR faceMesh provides the tracking data
            const face = mindarThree.faceMesh;
            // Check if mouth is open using blendshapes
            const mouthOpen = face.getBlendshapes ? face.getBlendshapes().jawOpen : 0;
            teethModel.visible = mouthOpen > 0.05;
          }
          renderer.render(scene, camera);
        });
      } catch (e) {
        console.error("Engine failed to start:", e);
      }
    };
  </script>
</body>
</html>
