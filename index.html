<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Professional 3D Teeth VTO Engine</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "mindar-face-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-three.prod.js"
      }
    }
  </script>
  <style>
    body { margin: 0; background: #000; overflow: hidden; font-family: sans-serif; }
    #container { width: 100vw; height: 100vh; position: relative; }
    #ui-layer { position: absolute; top: 20px; left: 20px; z-index: 20; color: white; background: rgba(0,0,0,0.6); padding: 15px; border-radius: 10px; }
    #startBtn { padding: 15px 30px; font-size: 18px; cursor: pointer; background: #00d2ff; border: none; border-radius: 5px; font-weight: bold; }
  </style>
</head>
<body>

  <div id="ui-layer">
    <h3>System Status: <span id="status">Waiting...</span></h3>
    <button id="startBtn">INITIALIZE CAMERA</button>
  </div>
  <div id="container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { MindARThree } from 'mindar-face-three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // 1. ENGINE SETUP
    const container = document.querySelector("#container");
    const statusText = document.querySelector("#status");
    const mindarThree = new MindARThree({ container: container });
    const { renderer, scene, camera } = mindarThree;

    // 2. ADD LIGHTING
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
    scene.add(ambientLight);
    const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
    directionalLight.position.set(0, 1, 1);
    scene.add(directionalLight);

    // 3. MOUTH ANCHOR
    const anchor = mindarThree.addAnchor(10); 
    let teethModel = null;

    // 4. LOAD THE MODEL
    const loader = new GLTFLoader();
    loader.load('./teeth.glb', (gltf) => {
      teethModel = gltf.scene;
      // Adjust scale and position here until it fits
      teethModel.scale.set(0.6, 0.6, 0.6); 
      // If it's too far forward, decrease Z (last number)
      // If it's too high, decrease Y (second number)
      teethModel.position.set(0, -0.4, 0.1); 
      teethModel.visible = false; 
      anchor.group.add(teethModel);
      statusText.innerText = "Model Loaded.";
    }, undefined, (err) => {
      statusText.innerText = "Error loading GLB!";
      console.error(err);
    });

    // 5. ENGINE START
    document.getElementById("startBtn").onclick = async () => {
      statusText.innerText = "Starting Camera...";
      await mindarThree.start();
      document.getElementById("startBtn").style.display = 'none';
      statusText.innerText = "Tracking Active.";

      renderer.setAnimationLoop(() => {
        // MOUTH DETECTION LOGIC
        if (teethModel) {
            // Check mouth opening (MindAR internal API)
            const mouthOpening = mindarThree.faceMesh.getBlendshapes()?.jawOpen || 0;
            // If mouth is open more than 10%, show teeth
            teethModel.visible = mouthOpening > 0.1;
        }
        renderer.render(scene, camera);
      });
    };
  </script>
</body>
</html>
