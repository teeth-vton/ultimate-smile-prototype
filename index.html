<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ultimate Smile - Dual Physics Engine</title>
  <style>
    body { margin: 0; background: #0a0a0a; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; font-family: -apple-system, sans-serif; color: white;}
    
    .dashboard-wrapper { display: flex; gap: 20px; align-items: center; justify-content: center; margin-top: 20px;}
    
    .screen-panel { position: relative; width: 480px; height: 360px; border-radius: 12px; overflow: hidden; background: #000; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #333;}
    .screen-label { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.8); padding: 6px 12px; border-radius: 6px; font-size: 11px; font-weight: bold; letter-spacing: 1px; z-index: 10;}
    
    /* The webcam feed is mirrored to act like a looking glass */
    #mainCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1); }
    #threeCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    video { display: none; }
    
    .header { text-align: center; margin-bottom: 10px; }
    .title { font-size: 22px; font-weight: 800; letter-spacing: 2px; }
    .subtitle { font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 1px; }

    #startButton { padding: 12px 30px; font-size: 14px; font-weight: bold; background: #fff; color: #000; border: none; border-radius: 30px; cursor: pointer; transition: 0.2s; margin-top: 15px;}
    #startButton:hover { transform: scale(1.05); }
    #startButton:disabled { background: #333; color: #666; cursor: not-allowed; transform: none;}
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs" type="module"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

  <div class="header">
    <div class="title">AR PHYSICS DIAGNOSTIC</div>
    <div class="subtitle">Verifying TMJ Jaw Articulation</div>
    <button id="startButton" disabled>Booting Engine...</button>
  </div>

  <div class="dashboard-wrapper">
    <div class="screen-panel">
      <div class="screen-label" style="color: #ff4444;">LEFT: AI WEBCAM TRACKING</div>
      <canvas id="mainCanvas" width="480" height="360"></canvas>
    </div>

    <div class="screen-panel" style="border-color: #44aaff;">
      <div class="screen-label" style="color: #44aaff;">RIGHT: 3D JAW PHYSICS</div>
      <canvas id="threeCanvas" width="480" height="360"></canvas>
    </div>
  </div>

  <video id="webcam" autoplay playsinline crossorigin="anonymous"></video>

  <script type="module">
    import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs";

    const video = document.getElementById("webcam");
    const mainCanvas = document.getElementById("mainCanvas");
    const mainCtx = mainCanvas.getContext("2d");
    const threeCanvas = document.getElementById("threeCanvas");
    const startButton = document.getElementById("startButton");

    // --- 1. THREE.JS 3D SETUP (RIGHT SCREEN) ---
    const scene = new THREE.Scene();
    
    // We use a Perspective Camera so you can see the 3D depth of the teeth
    const camera = new THREE.PerspectiveCamera(40, 480 / 360, 1, 1000);
    camera.position.set(0, 0, 300); // Pull camera back slightly

    const renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, alpha: false, antialias: true });
    renderer.setSize(480, 360);
    renderer.setClearColor(0x050505);

    const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
    dirLight.position.set(0, 50, 200);
    scene.add(dirLight);

    // Structural Groups
    let upperGroup = new THREE.Group();
    let lowerGroup = new THREE.Group();
    let masterContainer = new THREE.Group();
    masterContainer.add(upperGroup);
    masterContainer.add(lowerGroup);
    scene.add(masterContainer);

    let isModelReady = false;

    // Load and Process the Asset
    const loader = new THREE.GLTFLoader();
    const cleanUrl = 'teeth.glb?nocache=' + Date.now();

    loader.load(cleanUrl, function (gltf) {
      const rawModel = gltf.scene;
      
      const box = new THREE.Box3().setFromObject(rawModel);
      const center = new THREE.Vector3();
      box.getCenter(center);
      const size = new THREE.Vector3();
      box.getSize(size);

      // Auto-Normalize logic: Scale the model up so it looks good in the camera
      const normalizeScale = 100 / size.x; 
      masterContainer.scale.set(normalizeScale, normalizeScale, normalizeScale);

      // Split the teeth into Upper and Lower jaws
      rawModel.traverse((child) => {
        if (child.isMesh) {
          // Apply premium gloss material
          const origColor = child.material.color || new THREE.Color(0xffffff);
          child.material = new THREE.MeshPhysicalMaterial({
            color: origColor,
            roughness: 0.15,
            metalness: 0.0,
            clearcoat: 1.0,
            clearcoatRoughness: 0.05
          });

          const childBox = new THREE.Box3().setFromObject(child);
          const childCenter = new THREE.Vector3();
          childBox.getCenter(childCenter);
          
          // Center everything to 0,0,0
          child.position.sub(center);

          // Split logic based on geometric height
          if (childCenter.y > center.y) {
            upperGroup.add(child);
          } else {
            lowerGroup.add(child);
          }
        }
      });

      isModelReady = true;
      startButton.disabled = false;
      startButton.innerText = "Start Camera & Physics Sync";
    });

    // --- 2. MEDIAPIPE AI SETUP (LEFT SCREEN) ---
    let faceLandmarker;
    let lastVideoTime = -1;
    let isARActive = false;

    // Smoothing Math for perfectly stable 3D rotation
    let smoothYaw = 0, smoothRoll = 0, smoothPitch = 0;
    let smoothJawDrop = 0, smoothLateralShift = 0;
    const EMA_ALPHA = 0.4; // 40% responsiveness, 60% stabilization

    async function initializeAI() {
      const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm");
      faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
        baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task", delegate: "GPU" },
        runningMode: "VIDEO",
        numFaces: 1
      });
    }

    startButton.addEventListener("click", async () => {
      if (!isModelReady) return;
      startButton.style.display = "none";
      
      const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 480, height: 360 } });
      video.srcObject = stream;
      video.addEventListener("loadeddata", () => {
        isARActive = true;
        renderLoop();
      });
    });

    // --- 3. DYNAMIC SYNC LOOP ---
    function renderLoop() {
      if (video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        const results = faceLandmarker.detectForVideo(video, performance.now());

        // Draw Webcam Feed
        mainCtx.drawImage(video, 0, 0, 480, 360);

        if (isARActive && results.faceLandmarks && results.faceLandmarks.length > 0) {
          const lm = results.faceLandmarks[0];
          
          const leftLip = lm[78];
          const rightLip = lm[308];
          const topLip = lm[13];
          const bottomLip = lm[14];
          const chinTip = lm[152];
          const noseTip = lm[4];

          // --- LEFT SCREEN VISUALIZATION ---
          mainCtx.fillStyle = "#ff4444"; // Red for lips
          [78, 308, 13, 14].forEach(idx => {
            mainCtx.beginPath();
            mainCtx.arc(lm[idx].x * 480, lm[idx].y * 360, 4, 0, 2*Math.PI);
            mainCtx.fill();
          });
          
          mainCtx.fillStyle = "#44ff44"; // Green for Chin tracking
          mainCtx.beginPath();
          mainCtx.arc(chinTip.x * 480, chinTip.y * 360, 5, 0, 2*Math.PI);
          mainCtx.fill();

          // --- RIGHT SCREEN PHYSICS CALCULATION ---
          // 1. Head Rotation (Yaw & Roll)
          const rawYaw = Math.atan2(rightLip.z - leftLip.z, rightLip.x - leftLip.x);
          const rawRoll = Math.atan2(rightLip.y - leftLip.y, rightLip.x - leftLip.x);
          
          // 2. Head Pitch (Looking up/down) - Compare nose tip to chin depth
          const rawPitch = Math.atan2(chinTip.z - noseTip.z, chinTip.y - noseTip.y);

          // 3. Jaw Articulation (How far the mouth opens)
          const rawJawDrop = (bottomLip.y - topLip.y) * 480;

          // 4. Jaw Lateral Movement (Chewing side-to-side)
          const rawLateralShift = (chinTip.x - noseTip.x) * 100;

          // Apply Mathematical Smoothing to kill jitter
          smoothYaw = (rawYaw * EMA_ALPHA) + (smoothYaw * (1 - EMA_ALPHA));
          smoothRoll = (rawRoll * EMA_ALPHA) + (smoothRoll * (1 - EMA_ALPHA));
          smoothPitch = (rawPitch * EMA_ALPHA) + (smoothPitch * (1 - EMA_ALPHA));
          smoothJawDrop = (rawJawDrop * EMA_ALPHA) + (smoothJawDrop * (1 - EMA_ALPHA));
          smoothLateralShift = (rawLateralShift * EMA_ALPHA) + (smoothLateralShift * (1 - EMA_ALPHA));

          // --- APPLY PHYSICS TO THE 3D MODEL ---
          
          // Rotate the entire master container to follow head movement
          masterContainer.rotation.set(smoothPitch - 0.2, smoothYaw, -smoothRoll);

          // Apply TMJ physics: Drop the lower jaw on an X-axis hinge when lips part
          // Max limits ensure the jaw doesn't break backwards when closed
          const hingeRotation = Math.max(0, smoothJawDrop * 0.015);
          lowerGroup.rotation.set(-hingeRotation, 0, 0);

          // Apply lateral chew shift to the lower jaw
          lowerGroup.position.set(smoothLateralShift, 0, 0);

          // Render the 3D scene
          renderer.render(scene, camera);
        }
      }
      window.requestAnimationFrame(renderLoop);
    }

    initializeAI();
  </script>
</body>
</html>
