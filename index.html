<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ultimate Smile - Split Screen Diagnostic</title>
  <style>
    body { margin: 0; background: #111; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; font-family: sans-serif; color: white;}
    
    .dashboard { display: flex; gap: 20px; margin-top: 20px;}
    
    .screen-container { position: relative; width: 480px; height: 360px; border-radius: 12px; overflow: hidden; background: #000; border: 2px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5);}
    .screen-title { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 5px 10px; border-radius: 5px; font-size: 12px; font-weight: bold; z-index: 10; letter-spacing: 1px;}
    
    #mainCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transform: scaleX(-1); }
    #threeCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    video { display: none; }
    
    #startButton { padding: 15px 30px; font-size: 16px; font-weight: bold; background: #fff; color: #000; border: none; border-radius: 30px; cursor: pointer; margin-bottom: 20px; transition: 0.2s;}
    #startButton:hover { transform: scale(1.05); }
    #startButton:disabled { background: #555; color: #888; cursor: not-allowed; transform: none;}
    
    .status-panel { width: 980px; padding: 15px; background: #222; border-radius: 8px; margin-top: 20px; font-family: monospace; font-size: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px;}
    .data-row { display: flex; justify-content: space-between; border-bottom: 1px solid #333; padding-bottom: 5px; }
    .highlight { color: #00ff00; }
    .error { color: #ff3333; }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs" type="module"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

  <button id="startButton" disabled>Loading 3D Engine...</button>

  <div class="dashboard">
    <div class="screen-container">
      <div class="screen-title" style="color: #ff5555;">LEFT: AI RAW TRACKING</div>
      <canvas id="mainCanvas" width="480" height="360"></canvas>
    </div>

    <div class="screen-container">
      <div class="screen-title" style="color: #55aaff;">RIGHT: 3D ASSET VOID</div>
      <canvas id="threeCanvas" width="480" height="360"></canvas>
    </div>
  </div>

  <div class="status-panel">
    <div>
      <div style="color:#aaa; margin-bottom: 5px;">AI DATA</div>
      <div class="data-row"><span>Mouth Status:</span> <span id="data-mouth" class="error">CLOSED</span></div>
      <div class="data-row"><span>Mouth Width (px):</span> <span id="data-width">0</span></div>
    </div>
    <div>
      <div style="color:#aaa; margin-bottom: 5px;">3D ASSET DATA</div>
      <div class="data-row"><span>Original Model Width:</span> <span id="data-modelwidth">Loading...</span></div>
      <div class="data-row"><span>Applied Scale:</span> <span id="data-scale">0x</span></div>
    </div>
  </div>

  <video id="webcam" autoplay playsinline crossorigin="anonymous"></video>

  <script type="module">
    import { FaceLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs";

    const video = document.getElementById("webcam");
    const mainCanvas = document.getElementById("mainCanvas");
    const mainCtx = mainCanvas.getContext("2d");
    const threeCanvas = document.getElementById("threeCanvas");
    const startButton = document.getElementById("startButton");

    // UI Data Elements
    const dMouth = document.getElementById("data-mouth");
    const dWidth = document.getElementById("data-width");
    const dModelWidth = document.getElementById("data-modelwidth");
    const dScale = document.getElementById("data-scale");

    // --- THREE.JS SETUP (RIGHT SCREEN) ---
    const scene = new THREE.Scene();
    
    // We use a Perspective camera here to see depth properly in the void
    const camera = new THREE.PerspectiveCamera(45, 480 / 360, 1, 5000);
    camera.position.set(0, 0, 500); // Pull camera back so we can see the whole asset

    const renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, alpha: false, antialias: true });
    renderer.setSize(480, 360);
    renderer.setClearColor(0x0a0a0a); // Dark void background

    const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
    dirLight.position.set(0, 100, 300);
    scene.add(dirLight);

    // Helpers to visualize the math
    const axesHelper = new THREE.AxesHelper( 200 ); // Shows Red(X), Green(Y), Blue(Z) origin point
    scene.add( axesHelper );
    
    let teethMasterGroup = new THREE.Group();
    scene.add(teethMasterGroup);
    let originalWidth = 1;
    let isModelReady = false;

    // Load Asset
    const loader = new THREE.GLTFLoader();
    const cleanUrl = 'teeth.glb?nocache=' + Date.now();

    loader.load(cleanUrl, function (gltf) {
      const rawModel = gltf.scene;
      
      // Calculate original size
      const box = new THREE.Box3().setFromObject(rawModel);
      const size = new THREE.Vector3();
      box.getSize(size);
      
      originalWidth = size.x;
      dModelWidth.innerText = size.x.toFixed(2) + " units";

      // Draw a visible bounding box around whatever the artist made
      const boxHelper = new THREE.BoxHelper(rawModel, 0xff0000);
      teethMasterGroup.add(boxHelper);

      // Add the raw model
      teethMasterGroup.add(rawModel);

      isModelReady = true;
      startButton.disabled = false;
      startButton.innerText = "Start Diagnostic Scan";
    }, undefined, function(e){
      dModelWidth.innerText = "FILE ERROR";
    });


    // --- MEDIAPIPE AI SETUP (LEFT SCREEN) ---
    let faceLandmarker;
    let lastVideoTime = -1;
    let isARActive = false;

    // Lips and Jaw points
    const LIP_POINTS = [78, 308, 13, 14]; 

    async function initializeAI() {
      const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm");
      faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
        baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task", delegate: "GPU" },
        runningMode: "VIDEO",
        numFaces: 1
      });
    }

    startButton.addEventListener("click", async () => {
      if (!isModelReady) return;
      startButton.style.display = "none";
      
      const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 480, height: 360 } });
      video.srcObject = stream;
      video.addEventListener("loadeddata", () => {
        isARActive = true;
        renderLoop();
      });
    });

    // --- LOOP ---
    function renderLoop() {
      if (video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;
        const results = faceLandmarker.detectForVideo(video, performance.now());

        // Left Screen: Draw Video
        mainCtx.drawImage(video, 0, 0, 480, 360);

        if (isARActive && results.faceLandmarks && results.faceLandmarks.length > 0) {
          const lm = results.faceLandmarks[0];
          
          const leftCorner = lm[78], rightCorner = lm[308];
          const topLip = lm[13], bottomLip = lm[14];

          const mouthWidth = (rightCorner.x - leftCorner.x) * 480;
          const mouthHeight = (bottomLip.y - topLip.y) * 360;

          // Update Status Panel
          dWidth.innerText = mouthWidth.toFixed(0);
          
          if(mouthHeight > 5) {
             dMouth.innerText = "OPEN";
             dMouth.className = "highlight";
          } else {
             dMouth.innerText = "CLOSED";
             dMouth.className = "error";
          }

          // LEFT SCREEN: Draw Math Dots
          mainCtx.fillStyle = "red";
          LIP_POINTS.forEach(idx => {
            mainCtx.beginPath();
            mainCtx.arc(lm[idx].x * 480, lm[idx].y * 360, 3, 0, 2*Math.PI);
            mainCtx.fill();
          });
          
          // Draw Chin Pivot Dot
          mainCtx.fillStyle = "lime";
          mainCtx.beginPath();
          mainCtx.arc(lm[152].x * 480, lm[152].y * 360, 4, 0, 2*Math.PI);
          mainCtx.fill();


          // RIGHT SCREEN: Apply Live Math to the Asset
          if(mouthHeight > 5) {
            // How much do we need to stretch the model to fit the mouth width?
            const dynamicScale = mouthWidth / originalWidth;
            dScale.innerText = dynamicScale.toFixed(2) + "x";

            // Apply Scale
            teethMasterGroup.scale.set(dynamicScale, dynamicScale, dynamicScale);

            // Rotate based on head turn
            const yaw = Math.atan2(rightCorner.z - leftCorner.z, rightCorner.x - leftCorner.x);
            const roll = Math.atan2(rightCorner.y - leftCorner.y, rightCorner.x - leftCorner.x);
            teethMasterGroup.rotation.set(0, yaw, -roll);

            // Render Right Screen
            renderer.render(scene, camera);
          } else {
             // Reset visual when closed
             dScale.innerText = "0x";
             renderer.render(scene, camera);
          }
        }
      }
      window.requestAnimationFrame(renderLoop);
    }

    initializeAI();
  </script>
</body>
</html>
